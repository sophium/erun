name: build

# PR CI is the delivery pipeline's build step, driven by erun itself
# (docs /pipeline — "One flow, any driver"): CI bootstraps erun from the
# PR's own source and builds the erun-devops component. Tests run inside
# the build — the image's test stage runs `make integration-test` and the
# builder stage depends on its marker — so a failing gate fails the build,
# no image is tagged, and a green build is a tested build
# (docs /pipeline — "How you set it up — and where tests run").
#
# The build is component-scoped (`erun devops container build` from the
# component's docker directory) rather than a whole-repo `erun build`:
# dependent images such as erun-mcp FROM the unreleased bare
# erun-devops:<VERSION> tag, which a cold machine cannot resolve until a
# release publishes it — a known erun build gap tracked on #324.
# The component build is multi-arch like every erun build (no
# single-platform code path, per AGENTS.md); the qemu step installs binfmt
# so the daemon can produce the foreign arch. A plain build never pushes,
# so the job needs no registry credentials.
#
# The job must be marked as a required status check in branch protection:
# GitHub honors [skip ci] on a PR's head commit even for pull_request
# workflows, and a skipped required check blocks the merge (fails safe)
# instead of silently bypassing the gate.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: actions/setup-go@v5
        with:
          go-version-file: erun-cli/go.mod
          cache-dependency-path: |
            erun-cli/go.sum
            erun-common/go.sum
            erun-mcp/go.sum
      - name: Bootstrap erun from the PR source
        run: go build -C erun-cli -o "$RUNNER_TEMP/erun" .
      - name: Build the erun-devops component (tests run inside the build)
        working-directory: erun-devops/docker/erun-devops
        run: '"$RUNNER_TEMP/erun" -v devops container build'
