name: build

# PR CI is the delivery pipeline's build step, driven by erun itself
# (docs /pipeline — "One flow, any driver"): CI bootstraps erun from the
# PR's own source and runs `erun build`. Tests run inside the build — the
# erun-devops image's test stage runs `make integration-test` and the
# builder stage depends on its marker — so a failing gate fails the build,
# no image is tagged, and a green build is a tested build
# (docs /pipeline — "How you set it up — and where tests run").
#
# `erun build` builds every component for linux/amd64 and linux/arm64 (no
# single-platform code path, per AGENTS.md); the qemu step installs binfmt
# so the daemon can produce the foreign arch. Plain `erun build` never
# pushes, so the job needs no registry credentials.
#
# The job must be marked as a required status check in branch protection:
# GitHub honors [skip ci] on a PR's head commit even for pull_request
# workflows, and a skipped required check blocks the merge (fails safe)
# instead of silently bypassing the gate.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: actions/setup-go@v5
        with:
          go-version-file: erun-cli/go.mod
          cache-dependency-path: |
            erun-cli/go.sum
            erun-common/go.sum
            erun-mcp/go.sum
      - name: Bootstrap erun from the PR source
        run: go build -C erun-cli -o "$RUNNER_TEMP/erun" .
      - name: Run the pipeline build (tests run inside the build)
        run: '"$RUNNER_TEMP/erun" -v build'
