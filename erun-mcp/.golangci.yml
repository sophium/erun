version: "2"

run:
  timeout: 3m
  tests: true
# The default uniq-by-line:true keys findings by file+line only, ignoring
# column -- funlen/gocyclo/cyclop all anchor on the same func line, so it
# silently drops all but one finding on a function that trips more than one
# of them. Report everything found.
issues:
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - funlen
    - gocyclo
    - cyclop
  settings:
    funlen:
      lines: 100
      statements: 50
    gocyclo:
      min-complexity: 15
    cyclop:
      max-complexity: 10
formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: github.com/sophium/erun/erun-mcp
