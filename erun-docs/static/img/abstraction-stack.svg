<svg viewBox="0 0 1000 920" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="abstractionStackTitle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif">
  <title id="abstractionStackTitle">The ERun abstraction stack. Operator directs an Agent (Claude Code, Codex). A dashed 'loads' arrow brings skill bundles deployed into the env into the Agent's context. The Agent uses two channels into the env's runtime pod: ssh for file authoring and shell, mcp for typed ERun operations (init, deploy, doctor, list, build, raw). The Operator's IDE (VS Code, IntelliJ, Cursor) attaches over the same ssh channel — Agent and IDE see the same files. The runtime pod lives in a Kubernetes namespace alongside the env's application services (api, db, queue, ui); other envs live in their own namespaces in the same cluster.</title>

  <defs>
    <linearGradient id="asCharcoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0f1320"/>
    </linearGradient>
    <marker id="asArrowSolid" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0891b2"/>
    </marker>
    <marker id="asArrowDashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- Layer 1 — Operator -->
  <g>
    <rect x="420" y="20" width="160" height="46" rx="23" fill="url(#asCharcoal)"/>
    <text x="500" y="49" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600" letter-spacing="0.01em">Operator</text>
  </g>

  <!-- Arrow: directs -->
  <line x1="500" y1="66" x2="500" y2="130" stroke="#0891b2" stroke-width="1.5" marker-end="url(#asArrowSolid)"/>
  <g>
    <rect x="470" y="88" width="60" height="20" rx="10" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="500" y="102" text-anchor="middle" fill="#0891b2" font-size="12" font-weight="500">directs</text>
  </g>

  <!-- Layer 2 — Agent + Skills side panel -->
  <g>
    <rect x="380" y="130" width="240" height="90" rx="10" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <text x="500" y="170" text-anchor="middle" fill="currentColor" font-size="16" font-weight="600" letter-spacing="0.01em">Agent</text>
    <text x="500" y="195" text-anchor="middle" fill="currentColor" font-size="12.5" opacity="0.7">Claude Code, Codex, …</text>
  </g>
  <g>
    <rect x="700" y="140" width="220" height="70" rx="10" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="810" y="170" text-anchor="middle" fill="currentColor" font-size="14" font-weight="600">skills</text>
    <text x="810" y="190" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.7">deployed into the env</text>
  </g>
  <line x1="700" y1="175" x2="620" y2="175" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#asArrowDashed)"/>
  <g>
    <rect x="634" y="163" width="48" height="20" rx="10" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="658" y="178" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="500">loads</text>
  </g>

  <!-- Two channels diverging from Agent -->
  <!-- ssh: left arrow into runtime pod -->
  <line x1="445" y1="220" x2="420" y2="310" stroke="#0891b2" stroke-width="1.5" marker-end="url(#asArrowSolid)"/>
  <g>
    <rect x="360" y="252" width="120" height="20" rx="10" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="420" y="267" text-anchor="middle" fill="#0891b2" font-size="12" font-weight="500">ssh: files + shell</text>
  </g>
  <!-- mcp: right arrow into runtime pod -->
  <line x1="555" y1="220" x2="580" y2="310" stroke="#0891b2" stroke-width="1.5" marker-end="url(#asArrowSolid)"/>
  <g>
    <rect x="528" y="252" width="116" height="20" rx="10" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="586" y="267" text-anchor="middle" fill="#0891b2" font-size="12" font-weight="500">mcp: typed ops</text>
  </g>

  <!-- Layer 3 — Runtime pod -->
  <g>
    <rect x="280" y="310" width="440" height="130" rx="10" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <text x="500" y="338" text-anchor="middle" fill="currentColor" font-size="16" font-weight="600" letter-spacing="0.01em">Runtime pod</text>
    <text x="500" y="358" text-anchor="middle" fill="currentColor" font-size="12" opacity="0.7">shared workspace · Agent and IDE see the same files</text>

    <!-- Two endpoint pills inside -->
    <g>
      <rect x="320" y="385" width="160" height="32" rx="16" fill="url(#asCharcoal)"/>
      <text x="400" y="405" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">ssh server :22</text>
    </g>
    <g>
      <rect x="520" y="385" width="160" height="32" rx="16" fill="url(#asCharcoal)"/>
      <text x="600" y="405" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">mcp server :17000</text>
    </g>
  </g>

  <!-- IDE attach annotation — right of the runtime pod -->
  <g>
    <rect x="755" y="335" width="200" height="80" rx="10" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="855" y="365" text-anchor="middle" fill="currentColor" font-size="14" font-weight="600">Your IDE</text>
    <text x="855" y="385" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.7">VS Code, IntelliJ,</text>
    <text x="855" y="400" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.7">Cursor, Zed, …</text>
  </g>
  <line x1="755" y1="375" x2="720" y2="375" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#asArrowDashed)"/>
  <g>
    <rect x="724" y="355" width="32" height="18" rx="9" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="740" y="368" text-anchor="middle" fill="#22d3ee" font-size="11" font-weight="500">ssh</text>
  </g>

  <!-- Arrow: runs in -->
  <line x1="500" y1="440" x2="500" y2="500" stroke="#0891b2" stroke-width="1.5" marker-end="url(#asArrowSolid)"/>
  <g>
    <rect x="470" y="462" width="60" height="20" rx="10" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="500" y="476" text-anchor="middle" fill="#0891b2" font-size="12" font-weight="500">runs in</text>
  </g>

  <!-- Layer 4 — Kubernetes cluster card with namespaces inside -->
  <g>
    <rect x="40" y="500" width="920" height="400" rx="14" fill="#fbfcfd" stroke="#cbd5e0" stroke-width="1"/>
    <text x="500" y="530" text-anchor="middle" fill="currentColor" font-size="16" font-weight="600" letter-spacing="0.01em">Kubernetes cluster</text>
    <text x="500" y="550" text-anchor="middle" fill="currentColor" font-size="12" opacity="0.7">many namespaces · each a complete environment</text>

    <!-- ns: feature-a — the current env, highlighted -->
    <g>
      <rect x="80" y="580" width="280" height="290" rx="10" fill="none" stroke="#0891b2" stroke-width="1.5"/>
      <text x="220" y="610" text-anchor="middle" fill="currentColor" font-size="14" font-weight="600">ns: feature-a</text>
      <text x="220" y="628" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.6">current env</text>

      <g>
        <rect x="105" y="650" width="230" height="34" rx="6" fill="url(#asCharcoal)"/>
        <text x="220" y="671" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">runtime pod</text>
      </g>
      <text x="220" y="710" text-anchor="middle" fill="currentColor" font-size="12" font-weight="600">+ app services</text>
      <text x="220" y="732" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.65">api</text>
      <text x="220" y="750" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.65">db</text>
      <text x="220" y="768" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.65">queue</text>
      <text x="220" y="786" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.65">ui</text>
      <text x="220" y="828" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.55">one namespace = one env</text>
    </g>

    <!-- ns: feature-b -->
    <g>
      <rect x="400" y="580" width="280" height="290" rx="10" fill="none" stroke="#0891b2" stroke-width="1.5" opacity="0.6"/>
      <text x="540" y="610" text-anchor="middle" fill="currentColor" font-size="14" font-weight="600" opacity="0.75">ns: feature-b</text>
      <text x="540" y="628" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.5">another env</text>
      <g opacity="0.55">
        <rect x="425" y="650" width="230" height="34" rx="6" fill="url(#asCharcoal)"/>
        <text x="540" y="671" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">runtime pod</text>
      </g>
      <text x="540" y="710" text-anchor="middle" fill="currentColor" font-size="12" font-weight="600" opacity="0.6">+ app services</text>
      <text x="540" y="826" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.5">isolated from feature-a</text>
    </g>

    <!-- ns: feature-c -->
    <g>
      <rect x="720" y="580" width="220" height="290" rx="10" fill="none" stroke="#0891b2" stroke-width="1.5" opacity="0.6"/>
      <text x="830" y="610" text-anchor="middle" fill="currentColor" font-size="14" font-weight="600" opacity="0.75">ns: feature-c</text>
      <text x="830" y="628" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.5">another env</text>
      <g opacity="0.55">
        <rect x="745" y="650" width="170" height="34" rx="6" fill="url(#asCharcoal)"/>
        <text x="830" y="671" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">runtime pod</text>
      </g>
      <text x="830" y="826" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.5">… and as many as your cluster fits</text>
    </g>
  </g>
</svg>
