<svg viewBox="0 0 1000 760" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="abstractionStackTitle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif">
  <title id="abstractionStackTitle">The ERun abstraction stack, top to bottom: Operator directs the Agent; the Agent loads skill bundles deployed into the env and calls MCP tools (init, deploy, doctor, list, build, raw); the MCP layer drives the Kubernetes cluster, which holds many namespaces, each containing a complete environment (api, db, queue, ui). Each layer hides the complexity of the one below it.</title>

  <defs>
    <linearGradient id="asCharcoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0f1320"/>
    </linearGradient>
    <marker id="asArrowSolid" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0891b2"/>
    </marker>
    <marker id="asArrowDashed" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- Layer 1 — Operator (endpoint pill) -->
  <g>
    <rect x="420" y="20" width="160" height="46" rx="23" fill="url(#asCharcoal)"/>
    <text x="500" y="49" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="600" letter-spacing="0.01em">Operator</text>
  </g>

  <!-- Arrow: directs -->
  <line x1="500" y1="66" x2="500" y2="130" stroke="#0891b2" stroke-width="1.5" marker-end="url(#asArrowSolid)"/>
  <g>
    <rect x="470" y="88" width="60" height="20" rx="10" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="500" y="102" text-anchor="middle" fill="#0891b2" font-size="12" font-weight="500">directs</text>
  </g>

  <!-- Layer 2 — Agent (step box) -->
  <g>
    <rect x="360" y="130" width="280" height="90" rx="10" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <text x="500" y="170" text-anchor="middle" fill="currentColor" font-size="16" font-weight="600" letter-spacing="0.01em">Agent</text>
    <text x="500" y="195" text-anchor="middle" fill="currentColor" font-size="12.5" opacity="0.7">Claude Code, Codex, …</text>
  </g>

  <!-- Side input — skills loaded into the Agent -->
  <g>
    <rect x="720" y="140" width="220" height="70" rx="10" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5 5"/>
    <text x="830" y="170" text-anchor="middle" fill="currentColor" font-size="14" font-weight="600">skills</text>
    <text x="830" y="190" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.7">deployed into the env</text>
  </g>
  <line x1="720" y1="175" x2="640" y2="175" stroke="#22d3ee" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#asArrowDashed)"/>
  <g>
    <rect x="654" y="163" width="48" height="20" rx="10" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="678" y="178" text-anchor="middle" fill="#22d3ee" font-size="12" font-weight="500">loads</text>
  </g>

  <!-- Arrow: calls -->
  <line x1="500" y1="220" x2="500" y2="280" stroke="#0891b2" stroke-width="1.5" marker-end="url(#asArrowSolid)"/>
  <g>
    <rect x="476" y="240" width="48" height="20" rx="10" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="500" y="254" text-anchor="middle" fill="#0891b2" font-size="12" font-weight="500">calls</text>
  </g>

  <!-- Layer 3 — MCP tools (step box with tool pills inside) -->
  <g>
    <rect x="140" y="280" width="720" height="130" rx="10" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <text x="500" y="307" text-anchor="middle" fill="currentColor" font-size="16" font-weight="600" letter-spacing="0.01em">MCP tools</text>
    <text x="500" y="328" text-anchor="middle" fill="currentColor" font-size="12.5" opacity="0.7">Typed actions the Agent calls to manage environments</text>

    <!-- 6 tool pills: init, deploy, doctor, list, idle, raw -->
    <g>
      <rect x="150" y="355" width="100" height="30" rx="15" fill="url(#asCharcoal)"/>
      <text x="200" y="374" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">init</text>
    </g>
    <g>
      <rect x="270" y="355" width="100" height="30" rx="15" fill="url(#asCharcoal)"/>
      <text x="320" y="374" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">deploy</text>
    </g>
    <g>
      <rect x="390" y="355" width="100" height="30" rx="15" fill="url(#asCharcoal)"/>
      <text x="440" y="374" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">doctor</text>
    </g>
    <g>
      <rect x="510" y="355" width="100" height="30" rx="15" fill="url(#asCharcoal)"/>
      <text x="560" y="374" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">list</text>
    </g>
    <g>
      <rect x="630" y="355" width="100" height="30" rx="15" fill="url(#asCharcoal)"/>
      <text x="680" y="374" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">build</text>
    </g>
    <g>
      <rect x="750" y="355" width="100" height="30" rx="15" fill="url(#asCharcoal)"/>
      <text x="800" y="374" text-anchor="middle" fill="#ffffff" font-size="12" font-weight="600">raw</text>
    </g>
  </g>

  <!-- Arrow: drives -->
  <line x1="500" y1="410" x2="500" y2="470" stroke="#0891b2" stroke-width="1.5" marker-end="url(#asArrowSolid)"/>
  <g>
    <rect x="474" y="430" width="52" height="20" rx="10" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="500" y="444" text-anchor="middle" fill="#0891b2" font-size="12" font-weight="500">drives</text>
  </g>

  <!-- Layer 4 — Kubernetes cluster (step box with namespace cards inside) -->
  <g>
    <rect x="40" y="470" width="920" height="270" rx="10" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <text x="500" y="497" text-anchor="middle" fill="currentColor" font-size="16" font-weight="600" letter-spacing="0.01em">Kubernetes cluster</text>
    <text x="500" y="518" text-anchor="middle" fill="currentColor" font-size="12.5" opacity="0.7">Many namespaces, each a complete environment</text>

    <!-- 3 namespace cards: feature-a, feature-b, feature-c -->
    <g>
      <rect x="90" y="550" width="240" height="160" rx="14" fill="#fbfcfd" stroke="#cbd5e0" stroke-width="1"/>
      <text x="210" y="588" text-anchor="middle" fill="currentColor" font-size="15" font-weight="600">ns: feature-a</text>
      <text x="210" y="611" text-anchor="middle" fill="currentColor" font-size="12" opacity="0.7">full stack inside</text>
      <text x="210" y="660" text-anchor="middle" fill="currentColor" font-size="12" opacity="0.6">api · db · queue · ui</text>
    </g>
    <g>
      <rect x="380" y="550" width="240" height="160" rx="14" fill="#fbfcfd" stroke="#cbd5e0" stroke-width="1"/>
      <text x="500" y="588" text-anchor="middle" fill="currentColor" font-size="15" font-weight="600">ns: feature-b</text>
      <text x="500" y="611" text-anchor="middle" fill="currentColor" font-size="12" opacity="0.7">full stack inside</text>
      <text x="500" y="660" text-anchor="middle" fill="currentColor" font-size="12" opacity="0.6">api · db · queue · ui</text>
    </g>
    <g>
      <rect x="670" y="550" width="240" height="160" rx="14" fill="#fbfcfd" stroke="#cbd5e0" stroke-width="1"/>
      <text x="790" y="588" text-anchor="middle" fill="currentColor" font-size="15" font-weight="600">ns: feature-c</text>
      <text x="790" y="611" text-anchor="middle" fill="currentColor" font-size="12" opacity="0.7">full stack inside</text>
      <text x="790" y="660" text-anchor="middle" fill="currentColor" font-size="12" opacity="0.6">api · db · queue · ui</text>
    </g>
  </g>
</svg>
