<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Charcoal squircle background, mirrors the Mac app icon. -->
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2230"/>
      <stop offset="100%" stop-color="#0d111a"/>
    </linearGradient>
    <radialGradient id="cubeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#bgGrad)"/>

  <!-- Shell prompt glyph: chevron + underscore in white. -->
  <g fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 11 L13 16 L8 21"/>
    <path d="M11.5 22.6 H17"/>
  </g>

  <!-- Cyan glow + cube mark (small, abstracted from the app icon). -->
  <circle cx="23" cy="16" r="6" fill="url(#cubeGlow)"/>
  <g fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-linejoin="round">
    <path d="M23 12 L26.3 13.6 L26.3 17.4 L23 19 L19.7 17.4 L19.7 13.6 Z"/>
    <path d="M19.7 13.6 L23 15.2 L26.3 13.6"/>
    <path d="M23 15.2 L23 19"/>
  </g>
</svg>
