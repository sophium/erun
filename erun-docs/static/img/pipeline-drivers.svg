<svg viewBox="0 0 900 290" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="driversTitle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif">
  <title id="driversTitle">Four ways to drive one pipeline. Four charcoal pills — CLI, desktop app, MCP, CI — each send an arrow that converges into a single cyan box labelled the delivery pipeline (build, release, push, deploy). One arrow leaves the box to a charcoal pill labelled your environments.</title>

  <defs>
    <linearGradient id="pdCharcoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0f1320"/>
    </linearGradient>
    <marker id="pdArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- driver pills -->
  <rect x="50" y="40" width="160" height="46" rx="14" fill="url(#pdCharcoal)"/>
  <text x="130" y="69" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">CLI</text>

  <rect x="50" y="98" width="160" height="46" rx="14" fill="url(#pdCharcoal)"/>
  <text x="130" y="127" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">desktop app</text>

  <rect x="50" y="156" width="160" height="46" rx="14" fill="url(#pdCharcoal)"/>
  <text x="130" y="185" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">MCP</text>

  <rect x="50" y="214" width="160" height="46" rx="14" fill="url(#pdCharcoal)"/>
  <text x="130" y="243" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">CI</text>

  <!-- converging arrows -->
  <line x1="210" y1="63" x2="380" y2="150" stroke="#0891b2" stroke-width="1.5" marker-end="url(#pdArrow)"/>
  <line x1="210" y1="121" x2="380" y2="150" stroke="#0891b2" stroke-width="1.5" marker-end="url(#pdArrow)"/>
  <line x1="210" y1="179" x2="380" y2="150" stroke="#0891b2" stroke-width="1.5" marker-end="url(#pdArrow)"/>
  <line x1="210" y1="237" x2="380" y2="150" stroke="#0891b2" stroke-width="1.5" marker-end="url(#pdArrow)"/>

  <!-- pipeline box -->
  <rect x="382" y="110" width="220" height="80" rx="16" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="492" y="146" text-anchor="middle" fill="currentColor" font-size="15" font-weight="600">delivery pipeline</text>
  <text x="492" y="168" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.65">build · release · push · deploy</text>

  <!-- out to environments -->
  <line x1="602" y1="150" x2="700" y2="150" stroke="#0891b2" stroke-width="1.5" marker-end="url(#pdArrow)"/>
  <rect x="700" y="127" width="160" height="46" rx="14" fill="url(#pdCharcoal)"/>
  <text x="780" y="156" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">your environments</text>
</svg>
