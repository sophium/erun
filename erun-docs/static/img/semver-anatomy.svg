<svg viewBox="0 0 820 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="semverTitle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif">
  <title id="semverTitle">Anatomy of a version string. The example 1.4.2-rc.abc1234 splits into four labelled parts: MAJOR (1) marks a breaking change, MINOR (4) a new feature, PATCH (2) a fix, and the pre-release suffix (-rc.abc1234) marks a non-stable build — a candidate, prerelease, or snapshot. A stable release drops the suffix and is just 1.4.2.</title>

  <defs>
    <linearGradient id="svCharcoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0f1320"/>
    </linearGradient>
  </defs>

  <text x="410" y="34" text-anchor="middle" fill="currentColor" font-size="16" font-weight="600">Anatomy of a version</text>

  <!-- MAJOR -->
  <rect x="60" y="62" width="64" height="56" rx="12" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="92" y="99" text-anchor="middle" fill="currentColor" font-size="22" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">1</text>
  <text x="134" y="101" text-anchor="middle" fill="currentColor" font-size="22" opacity="0.55">.</text>

  <!-- MINOR -->
  <rect x="148" y="62" width="64" height="56" rx="12" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="180" y="99" text-anchor="middle" fill="currentColor" font-size="22" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">4</text>
  <text x="222" y="101" text-anchor="middle" fill="currentColor" font-size="22" opacity="0.55">.</text>

  <!-- PATCH -->
  <rect x="236" y="62" width="64" height="56" rx="12" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="268" y="99" text-anchor="middle" fill="currentColor" font-size="22" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2</text>

  <!-- pre-release suffix -->
  <rect x="332" y="62" width="240" height="56" rx="14" fill="url(#svCharcoal)"/>
  <text x="452" y="97" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">-rc.abc1234</text>

  <!-- labels -->
  <text x="92" y="148" text-anchor="middle" fill="currentColor" font-size="12.5" font-weight="600">MAJOR</text>
  <text x="92" y="166" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.6">breaking</text>

  <text x="180" y="148" text-anchor="middle" fill="currentColor" font-size="12.5" font-weight="600">MINOR</text>
  <text x="180" y="166" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.6">feature</text>

  <text x="268" y="148" text-anchor="middle" fill="currentColor" font-size="12.5" font-weight="600">PATCH</text>
  <text x="268" y="166" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.6">fix</text>

  <text x="452" y="148" text-anchor="middle" fill="currentColor" font-size="12.5" font-weight="600">pre-release</text>
  <text x="452" y="166" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.6">candidate · prerelease · snapshot</text>

  <!-- bottom note -->
  <text x="410" y="196" text-anchor="middle" fill="currentColor" font-size="12.5" opacity="0.7">A stable release drops the suffix — just 1.4.2</text>
</svg>
