<svg viewBox="0 0 880 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="buildStagesTitle"
     font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif">
  <title id="buildStagesTitle">A multi-stage Docker build inside one Dockerfile: a builder stage that runs the tests then compiles the artefact, and a runtime stage that ships only the artefact, producing a tagged multi-arch container image.</title>

  <defs>
    <linearGradient id="charcoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0f1320"/>
    </linearGradient>
    <marker id="arrowSolid" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- multi-stage Dockerfile card -->
  <rect x="20" y="28" width="560" height="158" rx="18" fill="#fbfcfd" stroke="#cbd5e0" stroke-width="1"/>
  <text x="300" y="52" text-anchor="middle" fill="currentColor" font-size="13" font-weight="600" opacity="0.65">one Dockerfile, two stages</text>

  <!-- builder stage -->
  <rect x="48" y="74" width="232" height="86" rx="14" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="164" y="110" text-anchor="middle" fill="currentColor" font-size="15" font-weight="600">builder stage</text>
  <text x="164" y="134" text-anchor="middle" fill="currentColor" font-size="13" opacity="0.85">run tests, then compile</text>

  <!-- runtime stage -->
  <rect x="340" y="74" width="232" height="86" rx="14" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="456" y="110" text-anchor="middle" fill="currentColor" font-size="15" font-weight="600">runtime stage</text>
  <text x="456" y="134" text-anchor="middle" fill="currentColor" font-size="13" opacity="0.85">ship artefact only</text>

  <!-- builder to runtime -->
  <line x1="280" y1="117" x2="340" y2="117" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arrowSolid)"/>
  <g>
    <rect x="288" y="95" width="44" height="20" rx="10" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="310" y="109" text-anchor="middle" fill="#0891b2" font-size="11" font-weight="500">COPY</text>
  </g>

  <!-- runtime to image -->
  <line x1="574" y1="117" x2="648" y2="117" stroke="#0891b2" stroke-width="1.5" marker-end="url(#arrowSolid)"/>

  <!-- container image endpoint -->
  <rect x="650" y="90" width="200" height="56" rx="14" fill="url(#charcoal)"/>
  <text x="750" y="114" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">container image</text>
  <text x="750" y="134" text-anchor="middle" fill="#ffffff" font-size="12" opacity="0.85">amd64 + arm64</text>
</svg>
