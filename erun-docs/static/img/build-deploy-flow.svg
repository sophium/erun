<svg viewBox="0 0 1000 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="buildDeployFlowTitle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif">
  <title id="buildDeployFlowTitle">Build and deploy flow. Source code in an agent environment is turned into a tagged container image by 'erun build', pushed to a container registry by 'erun push', and then rolled out to a runtime environment by 'erun deploy'. The arrows are labelled with the commands that move artefacts between stages. Agent envs build and push; runtime envs receive deploys.</title>

  <defs>
    <linearGradient id="bdCharcoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0f1320"/>
    </linearGradient>
    <marker id="bdArrowSolid" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="44" text-anchor="middle" fill="currentColor" font-size="18" font-weight="600" letter-spacing="0.01em">Build → push → deploy</text>
  <text x="500" y="68" text-anchor="middle" fill="currentColor" font-size="13" opacity="0.65">agent env builds and pushes; runtime env receives the deploy</text>

  <!-- Source -->
  <g>
    <rect x="60" y="120" width="170" height="80" rx="14" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <text x="145" y="151" text-anchor="middle" fill="currentColor" font-size="14" font-weight="600">source</text>
    <text x="145" y="172" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.65">your code in</text>
    <text x="145" y="188" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.65">an agent env</text>
  </g>

  <!-- Image -->
  <g>
    <rect x="290" y="120" width="170" height="80" rx="14" fill="url(#bdCharcoal)"/>
    <text x="375" y="151" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">image</text>
    <text x="375" y="172" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">:&lt;version&gt;</text>
    <text x="375" y="188" text-anchor="middle" fill="#ffffff" font-size="10.5" opacity="0.65">tagged + multi-arch</text>
  </g>

  <!-- Registry -->
  <g>
    <rect x="520" y="120" width="170" height="80" rx="14" fill="url(#bdCharcoal)"/>
    <text x="605" y="151" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">registry</text>
    <text x="605" y="172" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ghcr.io / …</text>
    <text x="605" y="188" text-anchor="middle" fill="#ffffff" font-size="10.5" opacity="0.65">durable store</text>
  </g>

  <!-- Runtime env -->
  <g>
    <rect x="750" y="120" width="190" height="80" rx="14" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <text x="845" y="151" text-anchor="middle" fill="currentColor" font-size="14" font-weight="600">runtime env</text>
    <text x="845" y="172" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.65">serves the version</text>
    <text x="845" y="188" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.65">from the registry</text>
  </g>

  <!-- Arrows between -->
  <line x1="230" y1="160" x2="290" y2="160" stroke="#0891b2" stroke-width="1.5" marker-end="url(#bdArrowSolid)"/>
  <line x1="460" y1="160" x2="520" y2="160" stroke="#0891b2" stroke-width="1.5" marker-end="url(#bdArrowSolid)"/>
  <line x1="690" y1="160" x2="750" y2="160" stroke="#0891b2" stroke-width="1.5" marker-end="url(#bdArrowSolid)"/>

  <!-- Arrow labels -->
  <g>
    <rect x="232" y="103" width="86" height="20" rx="10" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="275" y="117" text-anchor="middle" fill="#0891b2" font-size="11.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">erun build</text>
  </g>
  <g>
    <rect x="462" y="103" width="86" height="20" rx="10" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="505" y="117" text-anchor="middle" fill="#0891b2" font-size="11.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">erun push</text>
  </g>
  <g>
    <rect x="690" y="103" width="100" height="20" rx="10" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="740" y="117" text-anchor="middle" fill="#0891b2" font-size="11.5" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">erun deploy</text>
  </g>

  <!-- Bottom annotation -->
  <text x="500" y="248" text-anchor="middle" fill="currentColor" font-size="13" font-weight="500" opacity="0.7">Agent envs use snapshot tags. Runtime envs use stable release tags from the registry.</text>
</svg>
