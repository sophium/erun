<svg viewBox="0 0 880 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="buildDiscoveryTitle"
     font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif">
  <title id="buildDiscoveryTitle">How build discovers what to build: under the project root, the tenant's devops docker directory holds one directory per component, each with a Dockerfile and an optional VERSION file. Every such directory is one image.</title>

  <!-- project root card -->
  <rect x="20" y="34" width="840" height="214" rx="18" fill="#fbfcfd" stroke="#cbd5e0" stroke-width="1"/>
  <text x="44" y="60" text-anchor="start" fill="currentColor" font-size="12" font-weight="600" opacity="0.55" letter-spacing="0.08em">PROJECT ROOT</text>

  <!-- devops docker directory card -->
  <rect x="52" y="78" width="776" height="150" rx="14" fill="#ffffff" stroke="#cbd5e0" stroke-width="1"/>
  <text x="76" y="102" text-anchor="start" fill="currentColor" font-size="13" font-weight="600" opacity="0.7">&lt;tenant&gt;-devops/docker/</text>

  <!-- one component box per image -->
  <rect x="76" y="128" width="224" height="76" rx="12" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="188" y="162" text-anchor="middle" fill="currentColor" font-size="15" font-weight="600">api/</text>
  <text x="188" y="184" text-anchor="middle" fill="currentColor" font-size="12" opacity="0.7">Dockerfile · VERSION</text>

  <rect x="328" y="128" width="224" height="76" rx="12" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="440" y="162" text-anchor="middle" fill="currentColor" font-size="15" font-weight="600">web/</text>
  <text x="440" y="184" text-anchor="middle" fill="currentColor" font-size="12" opacity="0.7">Dockerfile · VERSION</text>

  <rect x="580" y="128" width="224" height="76" rx="12" fill="none" stroke="#0891b2" stroke-width="1.5"/>
  <text x="692" y="162" text-anchor="middle" fill="currentColor" font-size="15" font-weight="600">worker/</text>
  <text x="692" y="184" text-anchor="middle" fill="currentColor" font-size="12" opacity="0.7">Dockerfile · VERSION</text>

  <!-- closer -->
  <text x="440" y="278" text-anchor="middle" fill="currentColor" font-size="13" font-weight="500" opacity="0.7">each docker/&lt;component&gt;/ directory → one image, tagged from the nearest VERSION file</text>
</svg>
