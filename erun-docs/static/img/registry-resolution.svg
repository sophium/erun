<svg viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="registryResolutionTitle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif">
  <title id="registryResolutionTitle">Container registry resolution. Four boxes left to right, falling through in priority order: P1 EnvConfig.containerregistry (per-user, per-env); P2 ProjectConfig.environments.&lt;env&gt;.containerregistry (per-project, per-env); P3 ProjectConfig.containerregistry (per-project, top-level); P4 ghcr.io/sophium (built-in default). Arrows between with the label 'if unset'. The first set value wins.</title>

  <defs>
    <linearGradient id="rrCharcoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0f1320"/>
    </linearGradient>
    <marker id="rrArrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="44" text-anchor="middle" fill="currentColor" font-size="18" font-weight="600" letter-spacing="0.01em">Registry resolution</text>
  <text x="500" y="68" text-anchor="middle" fill="currentColor" font-size="13" opacity="0.65">first set value wins · falls through to the next priority</text>

  <!-- P1 -->
  <g>
    <rect x="40" y="110" width="200" height="120" rx="14" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <text x="60" y="134" text-anchor="start" fill="#0891b2" font-size="11" font-weight="600" letter-spacing="0.08em">PRIORITY 1</text>
    <text x="140" y="161" text-anchor="middle" fill="currentColor" font-size="14" font-weight="600">Per-env override</text>
    <text x="140" y="187" text-anchor="middle" fill="currentColor" font-size="10.5" opacity="0.65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">EnvConfig.</text>
    <text x="140" y="202" text-anchor="middle" fill="currentColor" font-size="10.5" opacity="0.65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">containerregistry</text>
    <text x="140" y="220" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.55">per-user config</text>
  </g>

  <!-- P2 -->
  <g>
    <rect x="280" y="110" width="200" height="120" rx="14" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <text x="300" y="134" text-anchor="start" fill="#0891b2" font-size="11" font-weight="600" letter-spacing="0.08em">PRIORITY 2</text>
    <text x="380" y="161" text-anchor="middle" fill="currentColor" font-size="14" font-weight="600">Project per-env</text>
    <text x="380" y="187" text-anchor="middle" fill="currentColor" font-size="10.5" opacity="0.65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">environments.</text>
    <text x="380" y="202" text-anchor="middle" fill="currentColor" font-size="10.5" opacity="0.65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">&lt;env&gt;.containerregistry</text>
    <text x="380" y="220" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.55">.erun/config.yaml</text>
  </g>

  <!-- P3 -->
  <g>
    <rect x="520" y="110" width="200" height="120" rx="14" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <text x="540" y="134" text-anchor="start" fill="#0891b2" font-size="11" font-weight="600" letter-spacing="0.08em">PRIORITY 3</text>
    <text x="620" y="161" text-anchor="middle" fill="currentColor" font-size="14" font-weight="600">Project default</text>
    <text x="620" y="187" text-anchor="middle" fill="currentColor" font-size="10.5" opacity="0.65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">containerregistry</text>
    <text x="620" y="220" text-anchor="middle" fill="currentColor" font-size="11" opacity="0.55">.erun/config.yaml (top)</text>
  </g>

  <!-- P4 — built-in default, charcoal to mark "you didn't set anything" -->
  <g>
    <rect x="760" y="110" width="200" height="120" rx="14" fill="url(#rrCharcoal)"/>
    <text x="780" y="134" text-anchor="start" fill="#22d3ee" font-size="11" font-weight="600" letter-spacing="0.08em">PRIORITY 4</text>
    <text x="860" y="161" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="600">Built-in default</text>
    <text x="860" y="187" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">ghcr.io/sophium</text>
    <text x="860" y="220" text-anchor="middle" fill="#ffffff" font-size="11" opacity="0.55">always available</text>
  </g>

  <!-- Arrows + "if unset" labels -->
  <line x1="240" y1="170" x2="280" y2="170" stroke="#0891b2" stroke-width="1.5" marker-end="url(#rrArrow)"/>
  <line x1="480" y1="170" x2="520" y2="170" stroke="#0891b2" stroke-width="1.5" marker-end="url(#rrArrow)"/>
  <line x1="720" y1="170" x2="760" y2="170" stroke="#0891b2" stroke-width="1.5" marker-end="url(#rrArrow)"/>

  <g>
    <rect x="232" y="84" width="56" height="20" rx="10" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="260" y="98" text-anchor="middle" fill="#0891b2" font-size="11" font-weight="600">if unset</text>
  </g>
  <g>
    <rect x="472" y="84" width="56" height="20" rx="10" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="500" y="98" text-anchor="middle" fill="#0891b2" font-size="11" font-weight="600">if unset</text>
  </g>
  <g>
    <rect x="712" y="84" width="56" height="20" rx="10" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="740" y="98" text-anchor="middle" fill="#0891b2" font-size="11" font-weight="600">if unset</text>
  </g>

  <!-- Bottom annotation -->
  <text x="500" y="278" text-anchor="middle" fill="currentColor" font-size="13" font-weight="500" opacity="0.7">Override at the highest level you need — usually per-env for ECR, project-wide for ghcr.</text>
</svg>
