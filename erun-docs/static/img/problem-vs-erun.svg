<svg viewBox="0 0 1000 380" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="problemVsErunTitle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif">
  <title id="problemVsErunTitle">Side-by-side comparison. Left: without ERun, three tasks (feature, peer review, hotfix) compete for one shared running stack — only one is active, the other two are queued. Right: with ERun, each task gets its own Kubernetes namespace with a full stack inside, so all three run at the same time.</title>

  <defs>
    <linearGradient id="pveCharcoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0f1320"/>
    </linearGradient>
    <marker id="pveArrowSolid" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0891b2"/>
    </marker>
    <marker id="pveArrowMuted" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Section headings -->
  <text x="250" y="40" text-anchor="middle" fill="currentColor" font-size="16" font-weight="600" letter-spacing="0.01em">Without ERun</text>
  <text x="250" y="62" text-anchor="middle" fill="currentColor" font-size="12.5" opacity="0.7">tasks compete for one running stack</text>

  <text x="750" y="40" text-anchor="middle" fill="currentColor" font-size="16" font-weight="600" letter-spacing="0.01em">With ERun</text>
  <text x="750" y="62" text-anchor="middle" fill="currentColor" font-size="12.5" opacity="0.7">a namespace per task — all running</text>

  <!-- Vertical divider between halves -->
  <line x1="500" y1="20" x2="500" y2="360" stroke="currentColor" stroke-width="1" opacity="0.15"/>

  <!-- ============== LEFT: Without ERun ============== -->

  <!-- 3 task pills on left -->
  <g>
    <rect x="40" y="110" width="130" height="40" rx="20" fill="url(#pveCharcoal)"/>
    <text x="105" y="135" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">feature</text>
  </g>
  <g>
    <rect x="40" y="180" width="130" height="40" rx="20" fill="url(#pveCharcoal)"/>
    <text x="105" y="205" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">peer review</text>
  </g>
  <g>
    <rect x="40" y="250" width="130" height="40" rx="20" fill="url(#pveCharcoal)"/>
    <text x="105" y="275" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">hotfix</text>
  </g>

  <!-- Single stack box on right of left half -->
  <g>
    <rect x="320" y="110" width="160" height="180" rx="10" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <text x="400" y="148" text-anchor="middle" fill="currentColor" font-size="14" font-weight="600">Your dev stack</text>
    <text x="400" y="172" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.6">api · db</text>
    <text x="400" y="190" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.6">queue · ui</text>
    <text x="400" y="228" text-anchor="middle" fill="#0891b2" font-size="12" font-weight="600">in use: feature</text>
    <text x="400" y="262" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.55">queued: 2</text>
  </g>

  <!-- Arrows from tasks to stack (1 active, 2 queued) -->
  <line x1="170" y1="130" x2="320" y2="170" stroke="#0891b2" stroke-width="1.5" marker-end="url(#pveArrowSolid)"/>
  <g>
    <rect x="220" y="138" width="48" height="18" rx="9" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="244" y="151" text-anchor="middle" fill="#0891b2" font-size="11" font-weight="600">active</text>
  </g>

  <line x1="170" y1="200" x2="320" y2="200" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#pveArrowMuted)"/>
  <g>
    <rect x="220" y="190" width="50" height="18" rx="9" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="245" y="203" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">queued</text>
  </g>

  <line x1="170" y1="270" x2="320" y2="230" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 5" marker-end="url(#pveArrowMuted)"/>
  <g>
    <rect x="220" y="244" width="50" height="18" rx="9" fill="var(--ifm-background-color, #ffffff)"/>
    <text x="245" y="257" text-anchor="middle" fill="#94a3b8" font-size="11" font-weight="600">queued</text>
  </g>

  <!-- ============== RIGHT: With ERun ============== -->

  <!-- 3 task pills -->
  <g>
    <rect x="540" y="110" width="130" height="40" rx="20" fill="url(#pveCharcoal)"/>
    <text x="605" y="135" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">feature</text>
  </g>
  <g>
    <rect x="540" y="180" width="130" height="40" rx="20" fill="url(#pveCharcoal)"/>
    <text x="605" y="205" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">peer review</text>
  </g>
  <g>
    <rect x="540" y="250" width="130" height="40" rx="20" fill="url(#pveCharcoal)"/>
    <text x="605" y="275" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">hotfix</text>
  </g>

  <!-- 3 namespace boxes, one per task -->
  <g>
    <rect x="800" y="100" width="180" height="60" rx="10" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <text x="890" y="125" text-anchor="middle" fill="currentColor" font-size="14" font-weight="600">ns: feature</text>
    <text x="890" y="146" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.6">full stack inside</text>
  </g>
  <g>
    <rect x="800" y="170" width="180" height="60" rx="10" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <text x="890" y="195" text-anchor="middle" fill="currentColor" font-size="14" font-weight="600">ns: peer-review</text>
    <text x="890" y="216" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.6">full stack inside</text>
  </g>
  <g>
    <rect x="800" y="240" width="180" height="60" rx="10" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <text x="890" y="265" text-anchor="middle" fill="currentColor" font-size="14" font-weight="600">ns: hotfix</text>
    <text x="890" y="286" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.6">full stack inside</text>
  </g>

  <!-- 3 solid arrows, all active -->
  <line x1="670" y1="130" x2="800" y2="130" stroke="#0891b2" stroke-width="1.5" marker-end="url(#pveArrowSolid)"/>
  <line x1="670" y1="200" x2="800" y2="200" stroke="#0891b2" stroke-width="1.5" marker-end="url(#pveArrowSolid)"/>
  <line x1="670" y1="270" x2="800" y2="270" stroke="#0891b2" stroke-width="1.5" marker-end="url(#pveArrowSolid)"/>
</svg>
