<svg viewBox="0 0 1000 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tenantEnvsTitle" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif">
  <title id="tenantEnvsTitle">A diagram of a tenant and its environments. A single tenant pill labelled 'Tenant: myapp · one git repository' at the top fans out via three arrows to three environment cards. Each card shows an env name, a worktree path on disk, a branch, and an Operator + Agent pair: 'env: local' with worktree ~/code/myapp and branch main; 'env: rihards-develop' with worktree ~/code/myapp-feature-a and branch feature-a; 'env: rihards-hotfix' with worktree ~/code/myapp-hotfix and branch hotfix/urgent. A '+ more' indicator shows unlimited capacity. The strapline reads: 'Same project, different branches, full stacks running side by side.'</title>

  <defs>
    <linearGradient id="teCharcoal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#0f1320"/>
    </linearGradient>
    <marker id="teArrowSolid" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L9,3 L0,6 Z" fill="#0891b2"/>
    </marker>
  </defs>

  <!-- Title + subtitle -->
  <text x="500" y="46" text-anchor="middle" fill="currentColor" font-size="18" font-weight="600" letter-spacing="0.01em">Tenant + environments</text>
  <text x="500" y="70" text-anchor="middle" fill="currentColor" font-size="13" opacity="0.65">one project (one git repository), many environments — each with its own worktree</text>

  <!-- Tenant pill at top -->
  <g>
    <rect x="350" y="100" width="300" height="68" rx="14" fill="url(#teCharcoal)"/>
    <text x="500" y="135" text-anchor="middle" fill="#ffffff" font-size="18" font-weight="700">Tenant: myapp</text>
    <text x="500" y="156" text-anchor="middle" fill="#ffffff" font-size="11.5" opacity="0.75">one git repository</text>
  </g>

  <!-- 3 fanning arrows down to env cards -->
  <path d="M420 168 C 360 185, 220 200, 185 215" fill="none" stroke="#0891b2" stroke-width="1.5" marker-end="url(#teArrowSolid)"/>
  <line x1="500" y1="168" x2="500" y2="215" stroke="#0891b2" stroke-width="1.5" marker-end="url(#teArrowSolid)"/>
  <path d="M580 168 C 640 185, 780 200, 815 215" fill="none" stroke="#0891b2" stroke-width="1.5" marker-end="url(#teArrowSolid)"/>

  <!-- Env card 1: env: local -->
  <g>
    <rect x="45" y="215" width="280" height="160" rx="14" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <text x="185" y="248" text-anchor="middle" fill="currentColor" font-size="15" font-weight="600">env: local</text>
    <text x="185" y="276" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~/code/myapp</text>
    <text x="185" y="296" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.55">branch: main</text>
    <g>
      <rect x="105" y="320" width="75" height="26" rx="13" fill="url(#teCharcoal)"/>
      <text x="142.5" y="338" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Operator</text>
    </g>
    <g>
      <rect x="190" y="320" width="75" height="26" rx="13" fill="url(#teCharcoal)"/>
      <text x="227.5" y="338" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Agent</text>
    </g>
    <text x="185" y="365" text-anchor="middle" fill="currentColor" font-size="10.5" opacity="0.5">side by side, full stack inside</text>
  </g>

  <!-- Env card 2: env: rihards-develop -->
  <g>
    <rect x="360" y="215" width="280" height="160" rx="14" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <text x="500" y="248" text-anchor="middle" fill="currentColor" font-size="15" font-weight="600">env: rihards-develop</text>
    <text x="500" y="276" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~/code/myapp-feature-a</text>
    <text x="500" y="296" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.55">branch: feature-a</text>
    <g>
      <rect x="420" y="320" width="75" height="26" rx="13" fill="url(#teCharcoal)"/>
      <text x="457.5" y="338" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Operator</text>
    </g>
    <g>
      <rect x="505" y="320" width="75" height="26" rx="13" fill="url(#teCharcoal)"/>
      <text x="542.5" y="338" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Agent</text>
    </g>
    <text x="500" y="365" text-anchor="middle" fill="currentColor" font-size="10.5" opacity="0.5">side by side, full stack inside</text>
  </g>

  <!-- Env card 3: env: rihards-hotfix -->
  <g>
    <rect x="675" y="215" width="280" height="160" rx="14" fill="none" stroke="#0891b2" stroke-width="1.5"/>
    <text x="815" y="248" text-anchor="middle" fill="currentColor" font-size="15" font-weight="600">env: rihards-hotfix</text>
    <text x="815" y="276" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.65" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">~/code/myapp-hotfix</text>
    <text x="815" y="296" text-anchor="middle" fill="currentColor" font-size="11.5" opacity="0.55">branch: hotfix/urgent</text>
    <g>
      <rect x="735" y="320" width="75" height="26" rx="13" fill="url(#teCharcoal)"/>
      <text x="772.5" y="338" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Operator</text>
    </g>
    <g>
      <rect x="820" y="320" width="75" height="26" rx="13" fill="url(#teCharcoal)"/>
      <text x="857.5" y="338" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="600">Agent</text>
    </g>
    <text x="815" y="365" text-anchor="middle" fill="currentColor" font-size="10.5" opacity="0.5">side by side, full stack inside</text>
  </g>

  <!-- BOTTOM ANNOTATION -->
  <text x="500" y="425" text-anchor="middle" fill="currentColor" font-size="13" font-weight="500" opacity="0.7">Same project, different branches — full stacks running side by side, all in parallel.</text>
</svg>
