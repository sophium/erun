version: "2"

run:
  timeout: 3m
  tests: true
# uniq-by-line would drop all but one funlen/gocyclo/cyclop finding anchored on the same func line.
issues:
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - funlen
    - gocyclo
    - cyclop
    - revive
    - errorlint
    - bodyclose
    - nilerr
    - nilnil
    - exhaustive
    - gocritic
    - forcetypeassert
    - errchkjson
    - predeclared
    - errname
    - unconvert
    - copyloopvar
    - usestdlibvars
    - misspell
    - wastedassign
    - mirror
    - nestif
    - makezero
    - durationcheck
    - nakedret
    - depguard
  settings:
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 500
              skipComments: true
              skipBlankLines: true
    depguard:
      rules:
        erun-common-layers:
          list-mode: lax
          files: ["$all"]
          allow:
            - github.com/sophium/erun/erun-common/base/
            - github.com/sophium/erun/erun-common/infra/cloud
            - github.com/sophium/erun/erun-common/infra/mcpauth$
            - github.com/sophium/erun/erun-common/infra/mcptools$
            - github.com/sophium/erun/erun-common/infra/platformclient$
          deny:
            - pkg: github.com/sophium/erun/erun-common
              desc: erun-backend-api may import erun-common's base/*, infra/cloud/* and infra/{mcpauth,mcptools,platformclient} only
    funlen:
      lines: 100
      statements: 50
    gocyclo:
      min-complexity: 15
    cyclop:
      max-complexity: 10
formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: github.com/sophium/erun/erun-backend/erun-backend-api
