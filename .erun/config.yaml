# Agent nodes are x86_64 and gate builds publish nothing, so skip emulated arm64 by default.
# `erun build --release` and `erun push` ignore this and always build every architecture.
docker:
    platforms:
        - linux/amd64
environments:
    code2:
        docker:
            fingerprints:
                erun-ubuntu: d23f28efcd9d0148
                erun-zitadel: 099e1ae63c85cce7
                erun-zitadel-login: 85aca40ec3227be5
    # Fingerprint pins resolve per exact environment key with no shared scope: keep every
    # block equal to the current Dockerfile's fingerprint, or that environment rebuilds from source.
    code1:
        docker:
            fingerprints:
                erun-ubuntu: d23f28efcd9d0148
                erun-zitadel: 099e1ae63c85cce7
                erun-zitadel-login: 85aca40ec3227be5
    code3:
        docker:
            fingerprints:
                erun-ubuntu: d23f28efcd9d0148
                erun-zitadel: 099e1ae63c85cce7
                erun-zitadel-login: 85aca40ec3227be5
    code4:
        docker:
            fingerprints:
                erun-ubuntu: d23f28efcd9d0148
                erun-zitadel: 099e1ae63c85cce7
                erun-zitadel-login: 85aca40ec3227be5
    # local may be any contributor's machine (including arm64): `platforms: []` opts out of the amd64 default.
    local:
        containerregistries:
            - registry: ghcr.io/sophium
              roles:
                - build
                - deploy
        docker:
            fingerprints:
                erun-ubuntu: d23f28efcd9d0148
                erun-zitadel: 099e1ae63c85cce7
                erun-zitadel-login: 85aca40ec3227be5
            platforms: []
        k8s:
            deployments:
                - - erun-devops
                  - erun-backend-postgres
                - erun-backend-db
                - erun-backend-api
