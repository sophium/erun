# docker.platforms is this project's default for every environment below: an
# environment that declares no platforms of its own inherits this list. Every
# agent environment of the erun tenant (code1-code4) runs on erun-node1, whose
# node is x86_64 (uname -m, docker info, `docker buildx inspect` listing arm64
# only as an emulated target), and a gate build there publishes nothing (no
# --release, no push), so building linux/arm64 only pays qemu emulation cost for
# an artifact nobody consumes. Measured on one gate build: amd64 13m21s against
# arm64 10m30s, so the discarded half is ~44% of the wall clock.
#
# It is stated once, here, rather than repeated per environment, because a
# per-environment pin only covers the environments someone remembered to list:
# the four agent environments shared one node, and three of them kept paying for
# emulated arm64 until each was named. A new agent environment now inherits this
# default instead of silently falling back to the multi-arch build. Environments
# that must not inherit it opt out with `platforms: []` -- see `local` below.
#
# This narrows local builds only -- `erun build --release` and `erun push` both
# resolve every architecture erun supports and never consult this config, so
# published images are unaffected: a released version always carries both amd64
# and arm64. Do not widen it back without re-confirming this node can schedule
# arm64 workloads; it cannot today.
docker:
    platforms:
        - linux/amd64
environments:
    code1:
        docker:
            fingerprints:
                erun-ubuntu: 43855fd29e16b9aa
                erun-zitadel: 3cba9e2a8ff916f2
                erun-zitadel-login: f3c59225f0f48170
