version: "2"

run:
  timeout: 3m
  tests: true
# The default uniq-by-line:true keys findings by file+line only, ignoring
# column -- funlen/gocyclo/cyclop all anchor on the same func line, so it
# silently drops all but one finding on a function that trips more than one
# of them. Report everything found.
issues:
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - funlen
    - gocyclo
    - cyclop
    - revive
    - depguard
  settings:
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 500
              skipComments: true
              skipBlankLines: true
    # One package per command (#2741, erun-common/AGENTS.md "Package layers"):
    # a command reaches another only through cmd/shared, so an edit to one
    # command rebuilds that command and the root that registers it, not every
    # command's test binary.
    depguard:
      rules:
        commands:
          list-mode: lax
          files: ["**/erun-cli/cmd/*/*.go", "!**/erun-cli/cmd/shared/*.go"]
          allow:
            - github.com/sophium/erun/cmd/shared$
          deny:
            - pkg: github.com/sophium/erun/cmd
              desc: an erun-cli command package may import cmd/shared, never the root command or another command
        shared:
          list-mode: lax
          files: ["**/erun-cli/cmd/shared/*.go"]
          deny:
            - pkg: github.com/sophium/erun/cmd
              desc: cmd/shared sits below every command and imports none of them
    funlen:
      lines: 100
      statements: 50
    gocyclo:
      min-complexity: 15
    cyclop:
      max-complexity: 10
formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: github.com/sophium/erun
