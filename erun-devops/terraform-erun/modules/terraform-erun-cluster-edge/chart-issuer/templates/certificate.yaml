{{- /* Compare against "true": the value arrives from Terraform's helm `set` as a
       string, and Go templates treat any non-empty string as truthy. */ -}}
{{- if eq (toString .Values.wildcardCertificateEnabled) "true" }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ required "wildcardCertName is required" .Values.wildcardCertName }}
  namespace: {{ required "certNamespace is required" .Values.certNamespace }}
spec:
  secretName: {{ required "wildcardSecretName is required" .Values.wildcardSecretName }}
  issuerRef:
    name: {{ required "issuerName is required" .Values.issuerName }}
    kind: ClusterIssuer
  commonName: {{ printf "*.%s" .Values.servicesZone | quote }}
  dnsNames:
    - {{ printf "*.%s" .Values.servicesZone | quote }}
    - {{ .Values.servicesZone | quote }}
{{- end }}
{{- /* Per-env wildcard cert *.<envLabel>.<servicesZone> (e.g.
       *.frs-prod.services.erunpaas.com) issued INTO the env namespace, whose
       Secret `erun expose` references from its Ingress `tls.secretName`. One
       cert per env covers every exposed service — no per-host issuance. A single
       DNS-label wildcard can't reach two labels deep, so this is distinct from
       the apex *.<servicesZone> cert above. */ -}}
{{- if eq (toString .Values.perEnvCertificateEnabled) "true" }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ required "perEnvCertName is required" .Values.perEnvCertName }}
  namespace: {{ required "perEnvCertNamespace is required" .Values.perEnvCertNamespace }}
spec:
  secretName: {{ required "perEnvSecretName is required" .Values.perEnvSecretName }}
  issuerRef:
    name: {{ required "issuerName is required" .Values.issuerName }}
    kind: ClusterIssuer
  commonName: {{ printf "*.%s.%s" .Values.envLabel .Values.servicesZone | quote }}
  dnsNames:
    - {{ printf "*.%s.%s" .Values.envLabel .Values.servicesZone | quote }}
{{- end }}
