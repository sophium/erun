{{- /* A namespaced Issuer, not a cluster-scoped ClusterIssuer: a Certificate can
       only reference an Issuer in its own namespace, so an env can never use
       another env's issuer. This is the multi-tenant-safe shape (#818) and
       avoids the confusing cluster-scoped resource. The issuer, its certs, and
       the DNS-01 credential Secret all live in issuerNamespace (the env
       namespace). */ -}}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ required "issuerName is required" .Values.issuerName }}
  namespace: {{ required "issuerNamespace is required" .Values.issuerNamespace }}
spec:
  acme:
    email: {{ required "acmeEmail is required" .Values.acmeEmail | quote }}
    server: {{ required "acmeServer is required" .Values.acmeServer | quote }}
    privateKeySecretRef:
      name: {{ .Values.issuerName }}-account-key
    solvers:
      {{- if eq .Values.dns01Provider "powerdns-broker" }}
      # Multi-tenant-safe (#818): a namespaced webhook solver forwards the DNS-01
      # challenge to the cluster's shim, which carries this env's scoped token to
      # the broker. The broker authorizes the challenge FQDN against the token's
      # own subzone, so this per-tenant Issuer can never prove control of another
      # tenant's names even though PowerDNS holds one zone-wide TSIG key centrally.
      # No DNS credential lives in this namespace — only the env's token Secret.
      - dns01:
          webhook:
            groupName: {{ required "dns01WebhookGroupName is required" .Values.dns01WebhookGroupName | quote }}
            solverName: powerdns-broker
            config:
              brokerURL: {{ required "brokerURL is required" .Values.brokerURL | quote }}
              tokenSecretRef:
                name: {{ required "dns01TokenSecretName is required" .Values.dns01TokenSecretName }}
                key: {{ default "token" .Values.dns01TokenSecretKey }}
        selector:
          dnsZones:
            - {{ required "servicesZone is required" .Values.servicesZone | quote }}
      {{- else if eq .Values.dns01Provider "powerdns-rfc2136" }}
      # RFC2136 (DNS UPDATE + TSIG) direct to the self-hosted PowerDNS that is
      # authoritative for the delegated services zone. Used where the delegation
      # moved authority off Cloudflare; the TSIG key is minted by the erun-powerdns
      # chart and wired in by the module. The Secret it references lives in this
      # Issuer's namespace (namespaced Issuers resolve secretRefs locally).
      - dns01:
          rfc2136:
            nameserver: {{ required "rfc2136Nameserver is required" .Values.rfc2136Nameserver | quote }}
            tsigKeyName: {{ required "rfc2136TsigKeyName is required" .Values.rfc2136TsigKeyName | quote }}
            tsigAlgorithm: {{ required "rfc2136TsigAlgorithm is required" .Values.rfc2136TsigAlgorithm | quote }}
            tsigSecretSecretRef:
              name: {{ required "rfc2136TsigSecretName is required" .Values.rfc2136TsigSecretName }}
              key: {{ default "tsig-secret" .Values.rfc2136TsigSecretKey }}
        selector:
          dnsZones:
            - {{ required "servicesZone is required" .Values.servicesZone | quote }}
      {{- else }}
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: {{ required "cloudflareTokenSecret is required" .Values.cloudflareTokenSecret }}
              key: api-token
        selector:
          dnsZones:
            - {{ required "servicesZone is required" .Values.servicesZone | quote }}
      {{- end }}
