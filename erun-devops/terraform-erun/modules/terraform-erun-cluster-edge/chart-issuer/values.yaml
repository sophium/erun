# Defaults; the terraform-erun-cluster-edge module overrides every field via
# helm `set`. Listed here so the chart renders standalone (e.g. `helm template`).
issuerName: erun-cloudflare
acmeEmail: ""
acmeServer: https://acme-v02.api.letsencrypt.org/directory
servicesZone: ""
cloudflareTokenSecret: erun-cloudflare-cloudflare-token
certNamespace: cert-manager
# Pass-through as a string ("true"/"false"): the Terraform helm provider's
# `set.value` is always a string, and Go templates treat any non-empty string
# (including "false") as truthy, so the template compares against "true".
wildcardCertificateEnabled: "true"
wildcardCertName: erun-cloudflare-wildcard
wildcardSecretName: erun-cloudflare-wildcard-tls
# DNS-01 solver provider: "cloudflare" (default) or "powerdns-rfc2136" (DNS
# UPDATE + TSIG direct to the self-hosted PowerDNS authoritative for a delegated
# services zone). The RFC2136 fields are set by the module only in that mode.
dns01Provider: cloudflare
rfc2136Nameserver: ""
rfc2136TsigKeyName: ""
rfc2136TsigAlgorithm: HMACSHA256
rfc2136TsigSecretName: ""
rfc2136TsigSecretKey: tsig-secret
# Per-env wildcard cert *.<envLabel>.<servicesZone> issued into the env namespace;
# its Secret is what `erun expose` references. Off by default.
perEnvCertificateEnabled: "false"
perEnvCertName: ""
perEnvCertNamespace: ""
perEnvSecretName: ""
envLabel: ""
