# The module overrides every field; these keep the chart renderable standalone.
issuerName: erun-cloudflare
issuerNamespace: cert-manager
acmeEmail: ""
acmeServer: https://acme-v02.api.letsencrypt.org/directory
servicesZone: ""
cloudflareTokenSecret: erun-cloudflare-cloudflare-token
# Must equal issuerNamespace: a Certificate can only use an Issuer in its own namespace.
certNamespace: cert-manager
# A string: helm `set.value` is always one, so the template compares against "true".
wildcardCertificateEnabled: "true"
wildcardCertName: erun-cloudflare-wildcard
wildcardSecretName: erun-cloudflare-wildcard-tls
# "cloudflare", "powerdns-rfc2136", or "powerdns-broker" (the multi-tenant-safe path).
dns01Provider: cloudflare
rfc2136Nameserver: ""
rfc2136TsigKeyName: ""
rfc2136TsigAlgorithm: HMACSHA256
rfc2136TsigSecretName: ""
rfc2136TsigSecretKey: tsig-secret
# powerdns-broker only.
dns01WebhookGroupName: acme.erun.io
brokerURL: ""
dns01TokenSecretName: ""
dns01TokenSecretKey: token
# *.<envLabel>.<servicesZone>; `erun expose` references its Secret.
perEnvCertificateEnabled: "false"
perEnvCertName: ""
perEnvCertNamespace: ""
perEnvSecretName: ""
envLabel: ""
