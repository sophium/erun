# A per-cluster singleton; tenant isolation is enforced at the broker.

# Referenced by every per-tenant Issuer; keep stable across a cluster.
groupName: acme.erun.io

name: erun-dns01-webhook
namespace: cert-manager

# Required; the module sets it to the pinned erun version.
image: ""
imagePullPolicy: IfNotPresent

# The referenced Secrets must live in the cert-manager namespace.
imagePullSecrets: []

# Base URL; the shim appends /present and /cleanup.
brokerURL: ""

# Granted the domain-solver verb on this webhook's aggregated API.
certManager:
  namespace: cert-manager
  serviceAccountName: cert-manager
