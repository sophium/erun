{{- $mcpPort := default 17000 .Values.mcpPort -}}
{{- /* The environment's MCP edge is served by the runtime container itself, so
       every MCP-driven command runs with the environment's own toolchain. On by
       default; set mcpEnabled=false to run the pod without an edge. Resolved
       through hasKey because `default true` cannot express an explicit false. */ -}}
{{- $mcpEnabled := "true" -}}
{{- if hasKey .Values "mcpEnabled" -}}
  {{- $mcpEnabled = toString .Values.mcpEnabled -}}
{{- end -}}
{{- $sshPort := default 17022 .Values.sshPort -}}
{{- /*
worktreeStorage selects how the runtime pod sources its worktree.
  - "host":  hostPath mount of .Values.worktreeHostPath (default for local-agent envs).
  - "pvc":   PVC-backed checkout cloned at first boot (remote-agent envs).
  - "none":  no worktree mount (runtime envs that only receive deploys).
For backward compatibility: when unset and worktreeHostPath is provided,
behave as "host" so older deploys keep working. See
docs/concepts/environment-types for the type→storage mapping.
*/ -}}
{{- $worktreeStorage := default "" .Values.worktreeStorage -}}
{{- if eq $worktreeStorage "" -}}
  {{- if .Values.worktreeHostPath -}}
    {{- $worktreeStorage = "host" -}}
  {{- else -}}
    {{- $worktreeStorage = "none" -}}
  {{- end -}}
{{- end -}}
{{- $worktreeRepoName := default "" .Values.worktreeRepoName -}}
{{- if and (eq $worktreeStorage "host") (eq $worktreeRepoName "") -}}
  {{- $worktreeRepoName = base (required "worktreeHostPath is required when worktreeStorage is host" .Values.worktreeHostPath) -}}
{{- end -}}
{{- /*
repoPath is the in-pod git folder for this env's repo, derived from the repo
name regardless of worktree storage. A sourceless runtime env (storage "none",
no worktree volume) still gets ERUN_REPO_PATH set to it — the entrypoint
symlinks that folder at the image-baked /opt/erun/release, and erun resolves the
project root there. worktreePath stays gated on a mounted worktree (host/pvc).
*/ -}}
{{- $repoPath := "" -}}
{{- if ne $worktreeRepoName "" -}}
  {{- $repoPath = printf "/home/erun/git/%s" $worktreeRepoName -}}
{{- end -}}
{{- $worktreePath := "" -}}
{{- if ne $worktreeStorage "none" -}}
  {{- $worktreePath = required "worktreeRepoName is required when worktreeStorage is set" $repoPath -}}
{{- end -}}
{{- /*
Staging mounts for the init containers that prepare the volumes. An environment
created before the worktree claim existed kept its checkout on the home volume,
at the very path the claim mounts at — so the claim must not be able to shadow
it while the adoption reads it. Both volumes are therefore staged outside
/home/erun, at paths that are never the live worktree path.
*/ -}}
{{- $homeStagePath := "/mnt/erun-home" -}}
{{- $worktreeStagePath := "/mnt/erun-worktree" -}}
{{- $legacyWorktreePath := "" -}}
{{- if ne $worktreeRepoName "" -}}
  {{- $legacyWorktreePath = printf "%s/git/%s" $homeStagePath $worktreeRepoName -}}
{{- end -}}
{{- /*
envType is the canonical environment type written into the in-pod erun config
(EnvConfig.Type). It is the inverse of the worktreeStorage→type mapping that
erun-common/deploy.go:resolveWorktreeStorage applies, so the pod records the
same type the laptop resolved. The retired remote/snapshot pair is no longer
emitted; type is the single source of truth.
*/ -}}
{{- $envType := "runtime" -}}
{{- if eq $worktreeStorage "host" -}}
  {{- $envType = "local-agent" -}}
{{- else if eq $worktreeStorage "pvc" -}}
  {{- $envType = "remote-agent" -}}
{{- end -}}
{{- /* A `runtime` env installs published versions by reference and never
       builds, so the docker daemon sidecar (and its state PVC) has nothing to
       do there; only the env types that build get it. */ -}}
{{- $dindEnabled := ne $envType "runtime" -}}
{{- $idle := default dict .Values.idle -}}
{{- $idleTimeout := default "5m0s" $idle.timeout -}}
{{- $idleWorkingHours := default "08:00-20:00" $idle.workingHours -}}
{{- $idleTimezone := default "" $idle.timezone -}}
{{- $idleTrafficBytes := default 0 $idle.trafficBytes -}}
{{- $runtime := default dict .Values.runtime -}}
{{- $runtimeResources := default dict $runtime.resources -}}
{{- $runtimeLimits := default dict $runtimeResources.limits -}}
{{- $runtimeRequests := default dict $runtimeResources.requests -}}
{{- $runtimeCPU := default "4" $runtimeLimits.cpu -}}
{{- $runtimeMemory := default "8916Mi" $runtimeLimits.memory -}}
{{- $runtimeRequestCPU := default "0.25" $runtimeRequests.cpu -}}
{{- $runtimeRequestMemory := default "1024Mi" $runtimeRequests.memory -}}
{{- /* The erun-dind sidecar declares its own resources rather than relying on
       the namespace LimitRange's default: an unsized container in a quota'd
       namespace is defaulted to the *entire* configured quota width, so an
       unsized dind silently doubled the pod's real ResourceQuota consumption
       Defaults mirror eruncommon.DefaultRuntimeDindCPU/Memory in
       erun-common/runtime_resources.go — keep the two in sync. */ -}}
{{- $dind := default dict $runtime.dind -}}
{{- $dindResources := default dict $dind.resources -}}
{{- $dindLimits := default dict $dindResources.limits -}}
{{- $dindRequests := default dict $dindResources.requests -}}
{{- $dindCPU := default "4" $dindLimits.cpu -}}
{{- $dindMemory := default "8916Mi" $dindLimits.memory -}}
{{- $dindRequestCPU := default "0.25" $dindRequests.cpu -}}
{{- $dindRequestMemory := default "1024Mi" $dindRequests.memory -}}
{{- /* Every init container below (prepare-volumes, adopt-worktree,
       install-binfmt) declares the same small explicit resources rather than
       relying on the namespace LimitRange's default: Kubernetes admits a pod
       on max(max(init container requests), sum(container requests)), so one
       unsized init container's inherited request can become the pod's entire
       effective request (this is the same shape already fixed for the
       dind sidecar above). Each does a few seconds of chown, file copy, or
       qemu binary registration, so one shared budget covers all three.
       Defaults mirror eruncommon.DefaultRuntimeInitContainerCPU/Memory in
       erun-common/runtime_resources.go — keep the two in sync. */ -}}
{{- $initContainers := default dict $runtime.initContainers -}}
{{- $initContainerResources := default dict $initContainers.resources -}}
{{- $initContainerLimits := default dict $initContainerResources.limits -}}
{{- $initContainerRequests := default dict $initContainerResources.requests -}}
{{- $initContainerCPU := default "0.5" $initContainerLimits.cpu -}}
{{- $initContainerMemory := default "256Mi" $initContainerLimits.memory -}}
{{- $initContainerRequestCPU := default "0.1" $initContainerRequests.cpu -}}
{{- $initContainerRequestMemory := default "64Mi" $initContainerRequests.memory -}}
{{- $managedCloud := default false .Values.managedCloud -}}
{{- $imageOverrides := default dict .Values.imageOverrides -}}
{{- $containerRegistry := default "ghcr.io/sophium" .Values.containerRegistry -}}
{{- $devopsImage := default (printf "%s/erun-devops:%s" $containerRegistry .Chart.AppVersion) (index $imageOverrides "erun-devops") -}}
{{- $dindImage := default "ghcr.io/sophium/erun-dind:28.1.1-1" (index $imageOverrides "erun-dind") -}}
{{- /* The gid of the `docker` group baked into the docker:<ver>-dind base, which
       owns the daemon socket. Surfaced as a value so an env can follow the base
       if that group ever moves, rather than losing the daemon on the next
       socket the daemon creates. */ -}}
{{- $dindDockerGid := default 2375 .Values.dindDockerGid -}}
{{- $cloudContext := default dict .Values.cloudContext -}}
{{- $cloudContextName := default "" $cloudContext.name -}}
{{- $cloudProvider := default "" $cloudContext.provider -}}
{{- $cloudProviderAlias := default "" $cloudContext.providerAlias -}}
{{- $cloudRegion := default "" $cloudContext.region -}}
{{- $cloudInstanceID := default "" $cloudContext.instanceId -}}
{{- $useHostCredentials := default false $cloudContext.useHostCredentials -}}
{{- $cloudflare := default dict $cloudContext.cloudflare -}}
{{- $cloudflareEnabled := default false $cloudflare.enabled -}}
{{- $cloudflareAccountId := default "" $cloudflare.accountId -}}
{{- $cloudflareSecretName := default "" $cloudflare.secretName -}}
{{- /* MCP auth edge: when enabled, mount the desktop public key and
       configure the per-env MCP server to require a bearer token signed by it.
       Absent/disabled renders byte-for-byte unchanged (legacy loopback-only). */ -}}
{{- $mcpAuth := default dict .Values.mcpAuth -}}
{{- $mcpAuthEnabled := default false $mcpAuth.enabled -}}
{{- $mcpAuthSecretName := default "" $mcpAuth.secretName -}}
{{- $mcpAuthIssuer := default "" $mcpAuth.issuer -}}
{{- $mcpAuthAudience := default "" $mcpAuth.audience -}}
{{- /* Fixed in-pod convention: must equal eruncommon.DesktopMCPPublicKeyPath
       (/etc/erun/mcp-auth/desktopid.pub), which the desktop's file:// issuer
       references and the MCP server loads the trusted key from. */ -}}
{{- $mcpAuthMountDir := "/etc/erun/mcp-auth" -}}
{{- $mcpAuthKeyFile := "desktopid.pub" -}}
{{- /* Registry credential: `erun init` mints this Secret from the operator's
       own resolved ghcr.io credential so a pod that has never authenticated
       to its registry on its own still can. Mounted read-only;
       the entrypoint merges it into ~/.docker/config.json at boot, seeding
       only host entries the pod doesn't already carry. Absent (no secret
       minted) renders byte-for-byte unchanged. `optional: true` so a deploy
       that races ahead of the secret's own apply still starts. */ -}}
{{- $registryCredentialSecretName := default "" .Values.registryCredentialSecretName -}}
{{- $registryCredentialMountDir := "/etc/erun/registry-credential" -}}
{{- $registryCredentialKeyFile := ".dockerconfigjson" -}}
{{- $claude := default dict .Values.claude -}}
{{- $claudeUseBedrock := default "0" $claude.useBedrock -}}
{{- $claudeUseMantle := default "0" $claude.useMantle -}}
{{- $claudeSmallFastRegion := default $cloudRegion $claude.smallFastModelAWSRegion -}}
{{- $claudeAvailableModels := default "opus,sonnet,haiku" $claude.availableModels -}}
{{- $claudeModel := default "" $claude.model -}}
{{- $claudeDefaultOpusModel := default "" $claude.defaultOpusModel -}}
{{- $claudeDefaultSonnetModel := default "" $claude.defaultSonnetModel -}}
{{- $claudeDefaultHaikuModel := default "" $claude.defaultHaikuModel -}}
{{- $claudeBedrockBaseURL := default "" $claude.bedrockBaseURL -}}
{{- $claudeMantleBaseURL := default "" $claude.mantleBaseURL -}}
{{- $claudeBedrockServiceTier := default "" $claude.bedrockServiceTier -}}
{{- $claudeSkipMantleAuth := default "" $claude.skipMantleAuth -}}
{{- $claudeDisablePromptCaching := default "" $claude.disablePromptCaching -}}
{{- $claudeEnablePromptCaching1H := default "" $claude.enablePromptCaching1H -}}
{{- /* Mirrors eruncommon.DefaultClaudeMaxOutputTokens (erun-common/claude.go); move both together. */ -}}
{{- $claudeMaxOutputTokens := default "32000" $claude.maxOutputTokens -}}
{{- $claudeMaxThinkingTokens := default "1024" $claude.maxThinkingTokens -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-home
  labels:
    app: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
{{- if $dindEnabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-docker
  labels:
    app: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
{{- end }}
{{- if eq $worktreeStorage "pvc" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-worktree
  labels:
    app: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
{{- with .Values.imagePullSecrets }}
imagePullSecrets:
  {{- toYaml . | nindent 2 }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
---
{{- if eq (required "environment is required" .Values.environment) "local" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-namespace-manager
  labels:
    app: {{ .Release.Name }}
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-namespace-manager
  labels:
    app: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-namespace-manager
---
# local-only: in contribute mode an operator runs `erun deploy` from inside the
# runtime pod, where helm authenticates as this release's ServiceAccount. That
# SA is bound to the built-in admin ClusterRole, which covers namespaced
# resources but deliberately withholds cluster-scoped RBAC — so an in-pod
# self-deploy could not even helm-diff the namespace-manager ClusterRole/
# bindings above (helm fails with "cannot get clusterroles at the cluster
# scope"). Grant the SA management of exactly this release's own cluster-scoped
# RBAC, by name, so an in-pod redeploy works without granting broad clusterrole
# escalation. The first install still comes from an admin context (which can
# create these); the SA only upgrades them in place, and it already holds every
# permission it re-applies, so the apiserver's escalation check passes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-self-deploy
  labels:
    app: {{ .Release.Name }}
rules:
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    resourceNames:
      - {{ .Release.Name }}-namespace-manager
      - {{ .Release.Name }}-self-deploy
    verbs:
      - get
      - update
      - patch
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
    resourceNames:
      - {{ .Release.Name }}
      - {{ .Release.Name }}-namespace-manager
      - {{ .Release.Name }}-self-deploy
    verbs:
      - get
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-self-deploy
  labels:
    app: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-self-deploy
---
{{- end }}
{{- if .Values.platformAccount }}
# Opt-in platform account: this env's runtime ServiceAccount is the cluster's
# erun platform admin, so in-pod `erun terraform apply` of the cluster edge and
# platform component installs (cert-manager, Traefik, PowerDNS) can create the
# cluster-scoped resources they require — namespaces, CRDs, cluster RBAC,
# webhooks. Bound to the built-in cluster-admin because the platform charts'
# cluster-scoped surface evolves and a curated role would need endless upkeep.
# The first bind is created by the admin-capable context that runs the initial
# deploy: the apiserver's escalation check requires the creator already hold
# everything it grants, so an in-pod self-deploy cannot bootstrap this itself.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-platform
  labels:
    app: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
{{- end }}
{{- with .Values.extraRules }}
# Extra cluster-scoped RBAC for the runtime ServiceAccount, supplied by a wrapper
# (e.g. a build env that adds a sidecar needing permissions the built-in admin
# binding does not grant). No-op unless set; namespaced access already comes from
# the admin binding above.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $.Release.Name }}-extra
  labels:
    app: {{ $.Release.Name }}
rules:
{{- toYaml . | nindent 2 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $.Release.Name }}-extra
  labels:
    app: {{ $.Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ $.Release.Name }}
    namespace: {{ $.Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $.Release.Name }}-extra
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  {{/* A stopped environment returns the runtime container's limits and (for
       build-capable env types) the dind sidecar's limits to the node. Declared
       here rather than left as a scale patch so a helm upgrade reconciles the
       operator's stop instead of silently restarting the pod. */}}
  replicas: {{ if .Values.stopped }}0{{ else }}1{{ end }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: true
      serviceAccountName: {{ .Release.Name }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- /* The runtime container reaches the daemon by owning the socket's
             group, not by the sidecar relaxing its mode: dockerd recreates the
             socket 0660 root:docker every time it starts, so any one-shot
             widening only covers the socket that existed when it ran. Applies
             pod-wide; the sidecar runs as root and is unaffected.

             Deliberately no fsGroup: it cannot be scoped to a subset of the
             pod's volumes, so it also reached the docker state claim and had
             the kubelet rewrite every image layer under it group-writable on
             each start — corrupting the permissions that containerised sshd,
             postgres and any baked 0600 secret depend on. The volumes the
             runtime user actually writes are handed to it by prepare-volumes
             below. fsGroupChangePolicy: OnRootMismatch is not the fix: dockerd
             resets its own root to 0710 root:root at every start, so the root
             permanently mismatches the fsGroup and the full sweep re-runs
             anyway. */}}
      {{- if $dindEnabled }}
      securityContext:
        supplementalGroups:
          - {{ $dindDockerGid }}
      {{- end }}
      initContainers:
        {{- /* Ownership of the claims the runtime user writes, established
               where fsGroup used to. Only the mount points are chowned: a
               freshly provisioned claim arrives empty and root-owned, which is
               the whole of what fsGroup was buying, while an existing claim's
               contents already belong to uid 1000. Recursing a populated home
               volume on every pod start would trade this bug for a slow one.
               Runs first so the adoption below sees a writable claim. A host
               worktree is the operator's own directory on the node and is
               never touched. */}}
        - image: {{ $devopsImage }}
          name: prepare-volumes
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 0
            runAsGroup: 0
          resources:
            limits:
              cpu: {{ $initContainerCPU | quote }}
              memory: {{ $initContainerMemory | quote }}
            requests:
              cpu: {{ $initContainerRequestCPU | quote }}
              memory: {{ $initContainerRequestMemory | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              chown 1000:1000 {{ $homeStagePath | quote }}
              {{- if eq $worktreeStorage "pvc" }}
              chown 1000:1000 {{ $worktreeStagePath | quote }}
              {{- end }}
          volumeMounts:
            - name: erun-home
              mountPath: {{ $homeStagePath | quote }}
            {{- if eq $worktreeStorage "pvc" }}
            - name: repo-worktree
              mountPath: {{ $worktreeStagePath | quote }}
            {{- end }}
        {{- if eq $worktreeStorage "pvc" }}
        # Adopt before mounting: a deploy that introduces the worktree claim to
        # an environment whose checkout still lives on the home volume would
        # otherwise mount an empty volume straight over that checkout, leaving it
        # unreachable through erun and letting the one-way workspace sync
        # propagate the empty tree over the operator's only other copy. Runs the
        # runtime image so no new image dependency is introduced; falls back to
        # refusing the rollout when an older image carries no adoption helper,
        # because starting is exactly what loses the tree.
        - image: {{ $devopsImage }}
          name: adopt-worktree
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            limits:
              cpu: {{ $initContainerCPU | quote }}
              memory: {{ $initContainerMemory | quote }}
            requests:
              cpu: {{ $initContainerRequestCPU | quote }}
              memory: {{ $initContainerRequestMemory | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              if [ -x /usr/local/bin/erun-adopt-worktree ]; then
                exec /usr/local/bin/erun-adopt-worktree {{ $legacyWorktreePath | quote }} {{ $worktreeStagePath | quote }}
              fi
              if [ -e {{ printf "%s/.git" $legacyWorktreePath | quote }} ]; then
                echo "worktree-adopt: this runtime image has no adoption helper; refusing to mount an empty worktree volume over the repository at {{ $worktreePath }}" >&2
                exit 1
              fi
              echo "worktree-adopt: this runtime image has no adoption helper; nothing to adopt at {{ $worktreePath }}"
          volumeMounts:
            - name: erun-home
              mountPath: {{ $homeStagePath | quote }}
            - name: repo-worktree
              mountPath: {{ $worktreeStagePath | quote }}
        {{- end }}
        {{- if $dindEnabled }}
        - image: tonistiigi/binfmt:qemu-v10.0.4-56
          name: install-binfmt
          imagePullPolicy: IfNotPresent
          args:
            - --install
            - amd64,arm64
          securityContext:
            privileged: true
          resources:
            limits:
              cpu: {{ $initContainerCPU | quote }}
              memory: {{ $initContainerMemory | quote }}
            requests:
              cpu: {{ $initContainerRequestCPU | quote }}
              memory: {{ $initContainerRequestMemory | quote }}
        {{- end }}
      containers:
        - image: {{ $devopsImage }}
          name: erun-devops
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /home/erun
            - name: KUBECONFIG
              value: /home/erun/.kube/config
            {{- if $dindEnabled }}
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: DOCKER_BUILDKIT
              value: "1"
            {{- end }}
            - name: ERUN_REPO_PATH
              value: {{ $repoPath | quote }}
            - name: ERUN_OUTPUTS_DIR
              value: /home/erun/.erun/outputs
            - name: ERUN_REPO_REMOTE
              value: {{ if eq $worktreeStorage "pvc" }}"true"{{ else }}"false"{{ end }}
            {{- if .Values.repoUrl }}
            - name: ERUN_REPO_URL
              value: {{ .Values.repoUrl | quote }}
            - name: ERUN_REPO_REF
              value: {{ default "" .Values.repoRef | quote }}
            {{- end }}
            - name: ERUN_ENV_TYPE
              value: {{ $envType | quote }}
            - name: ERUN_CLOUD_ENVIRONMENT
              value: {{ if $managedCloud }}"true"{{ else }}"false"{{ end }}
            - name: ERUN_CLOUD_CONTEXT_NAME
              value: {{ $cloudContextName | quote }}
            - name: ERUN_CLOUD_PROVIDER
              value: {{ $cloudProvider | quote }}
            - name: ERUN_CLOUD_PROVIDER_ALIAS
              value: {{ $cloudProviderAlias | quote }}
            - name: ERUN_CLOUD_REGION
              value: {{ $cloudRegion | quote }}
            - name: ERUN_CLOUD_INSTANCE_ID
              value: {{ $cloudInstanceID | quote }}
            {{- if .Values.runtimeRegistry }}
            - name: ERUN_RUNTIME_REGISTRY
              value: {{ .Values.runtimeRegistry | quote }}
            {{- end }}
            {{- if .Values.containerRegistries }}
            - name: ERUN_CONTAINER_REGISTRIES
              value: {{ .Values.containerRegistries | toJson | quote }}
            {{- end }}
            - name: ERUN_DISABLE_BUILD_SCRIPT
              value: {{ default false .Values.disableBuildScript | quote }}
            {{- /* These two are plain Claude Code tuning knobs, not AWS/Bedrock/Mantle
                   routing, so they render for every env regardless of cloud provider
                   unlike the block below them, which is genuinely AWS-only. */}}
            - name: CLAUDE_CODE_MAX_OUTPUT_TOKENS
              value: {{ $claudeMaxOutputTokens | quote }}
            - name: MAX_THINKING_TOKENS
              value: {{ $claudeMaxThinkingTokens | quote }}
            {{ if eq $cloudProvider "aws" }}
            {{ if $useHostCredentials }}
            - name: AWS_PROFILE
              value: "erun-host"
            {{ end }}
            {{- if eq $claudeUseBedrock "1" }}
            - name: CLAUDE_CODE_USE_BEDROCK
              value: "1"
            {{- end }}
            {{- if eq $claudeUseMantle "1" }}
            - name: CLAUDE_CODE_USE_MANTLE
              value: "1"
            {{- end }}
            {{- /* An empty AWS_REGION is worse than an absent one: it overrides
                   the region the pod's own profile or the operator's environment
                   would otherwise supply, so every AWS call builds an endpoint
                   with no region in it. Emit the variable only when a region
                   actually resolved. */}}
            {{- if $cloudRegion }}
            - name: AWS_REGION
              value: {{ $cloudRegion | quote }}
            {{- end }}
            {{- if $claudeSmallFastRegion }}
            - name: ANTHROPIC_SMALL_FAST_MODEL_AWS_REGION
              value: {{ $claudeSmallFastRegion | quote }}
            {{- end }}
            - name: ERUN_CLAUDE_AVAILABLE_MODELS
              value: {{ $claudeAvailableModels | quote }}
            {{ if $claudeModel }}
            - name: ANTHROPIC_MODEL
              value: {{ $claudeModel | quote }}
            {{ end }}
            {{ if $claudeDefaultOpusModel }}
            - name: ANTHROPIC_DEFAULT_OPUS_MODEL
              value: {{ $claudeDefaultOpusModel | quote }}
            {{ end }}
            {{ if $claudeDefaultSonnetModel }}
            - name: ANTHROPIC_DEFAULT_SONNET_MODEL
              value: {{ $claudeDefaultSonnetModel | quote }}
            {{ end }}
            {{ if $claudeDefaultHaikuModel }}
            - name: ANTHROPIC_DEFAULT_HAIKU_MODEL
              value: {{ $claudeDefaultHaikuModel | quote }}
            {{ end }}
            {{ if $claudeBedrockBaseURL }}
            - name: ANTHROPIC_BEDROCK_BASE_URL
              value: {{ $claudeBedrockBaseURL | quote }}
            {{ end }}
            {{ if $claudeMantleBaseURL }}
            - name: ANTHROPIC_BEDROCK_MANTLE_BASE_URL
              value: {{ $claudeMantleBaseURL | quote }}
            {{ end }}
            {{ if $claudeBedrockServiceTier }}
            - name: ANTHROPIC_BEDROCK_SERVICE_TIER
              value: {{ $claudeBedrockServiceTier | quote }}
            {{ end }}
            {{ if $claudeSkipMantleAuth }}
            - name: CLAUDE_CODE_SKIP_MANTLE_AUTH
              value: {{ $claudeSkipMantleAuth | quote }}
            {{ end }}
            {{ if $claudeDisablePromptCaching }}
            - name: DISABLE_PROMPT_CACHING
              value: {{ $claudeDisablePromptCaching | quote }}
            {{ end }}
            {{ if $claudeEnablePromptCaching1H }}
            - name: ENABLE_PROMPT_CACHING_1H
              value: {{ $claudeEnablePromptCaching1H | quote }}
            {{ end }}
            {{ end }}
            {{- if $cloudflareEnabled }}
            - name: CLOUDFLARE_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $cloudflareSecretName | quote }}
                  key: CLOUDFLARE_API_TOKEN
                  optional: true
            - name: CLOUDFLARE_ACCOUNT_ID
              value: {{ $cloudflareAccountId | quote }}
            {{- end }}
            - name: ERUN_KUBERNETES_CONTEXT
              value: in-cluster
            - name: ERUN_TENANT
              value: {{ required "tenant is required" .Values.tenant | quote }}
            - name: ERUN_ENVIRONMENT
              value: {{ required "environment is required" .Values.environment | quote }}
            - name: ERUN_SSHD_ENABLED
              value: {{ if .Values.sshdEnabled }}"true"{{ else }}"false"{{ end }}
            - name: ERUN_MCP_PORT
              value: {{ $mcpPort | quote }}
            - name: ERUN_MCP_ENABLED
              value: {{ $mcpEnabled | quote }}
            - name: ERUN_SSHD_PORT
              value: {{ $sshPort | quote }}
            - name: ERUN_IDLE_TIMEOUT
              value: {{ $idleTimeout | quote }}
            - name: ERUN_IDLE_WORKING_HOURS
              value: {{ $idleWorkingHours | quote }}
            - name: ERUN_IDLE_TIMEZONE
              value: {{ $idleTimezone | quote }}
            - name: ERUN_IDLE_TRAFFIC_BYTES
              value: {{ $idleTrafficBytes | quote }}
            - name: ERUN_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if $mcpAuthEnabled }}
            - name: ERUN_MCP_TRUSTED_ISSUER
              value: {{ $mcpAuthIssuer | quote }}
            - name: ERUN_MCP_AUDIENCE
              value: {{ $mcpAuthAudience | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: {{ $sshPort }}
              name: ssh
            {{- if eq $mcpEnabled "true" }}
            - containerPort: {{ $mcpPort }}
              name: mcp
            {{- end }}
          resources:
            limits:
              cpu: {{ $runtimeCPU | quote }}
              memory: {{ $runtimeMemory | quote }}
            requests:
              cpu: {{ $runtimeRequestCPU | quote }}
              memory: {{ $runtimeRequestMemory | quote }}
          volumeMounts:
            - name: erun-home
              mountPath: /home/erun
            {{- if ne $worktreeStorage "none" }}
            - name: repo-worktree
              mountPath: {{ $worktreePath | quote }}
            {{- end }}
            {{- if $dindEnabled }}
            - name: docker-socket
              mountPath: /var/run
            {{- end }}
            {{- /* Mount the desktop key only when there is one (file:// issuer).
                   The OIDC-issuer path (hosted) sets issuer+audience but no
                   secret, so gate the mount on secretName, not mcpAuthEnabled. */ -}}
            {{- if $mcpAuthSecretName }}
            - name: mcp-auth
              mountPath: {{ $mcpAuthMountDir | quote }}
              readOnly: true
            {{- end }}
            {{- if $registryCredentialSecretName }}
            - name: registry-credential
              mountPath: {{ $registryCredentialMountDir | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
        {{- if $dindEnabled }}
        - image: {{ $dindImage }}
          name: erun-dind
          imagePullPolicy: IfNotPresent
          resources:
            limits:
              cpu: {{ $dindCPU | quote }}
              memory: {{ $dindMemory | quote }}
            requests:
              cpu: {{ $dindRequestCPU | quote }}
              memory: {{ $dindRequestMemory | quote }}
          {{- /* A context-resolved local cluster registry is plain HTTP at a
                 non-loopback ClusterIP; the docker:dind entrypoint forwards these
                 args to dockerd so an in-pod build can push to it. Empty for
                 hosted (TLS) registries, so those pods are unchanged. */ -}}
          {{- with .Values.clusterRegistryInsecure }}
          args:
            - --insecure-registry
            - {{ . | quote }}
          {{- end }}
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          readinessProbe:
            exec:
              command:
                - sh
                - -lc
                - docker info >/dev/null 2>&1
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          {{- /* Waits for a daemon that answers, not for a socket file: a
                 SIGKILLed dockerd leaves its socket behind on the shared
                 emptyDir, so a file-existence wait returns instantly and widens
                 the inode the restarting daemon is about to replace. Bounded,
                 because kubernetes never times a postStart hook out; the chmod
                 is a courtesy for anything outside the socket's group, so its
                 failure must not hold the container back. */}}
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -lc
                  - 'i=0; until docker -H unix:///var/run/docker.sock info >/dev/null 2>&1 || [ "$i" -ge 300 ]; do i=$((i+1)); sleep 1; done; chmod 0666 /var/run/docker.sock 2>/dev/null || true'
          # The dind sidecar is the docker daemon that resolves a tenant's
          # docker-compose bind-mount sources on its own filesystem, so it must
          # see the same home + repo tree as the erun-devops container: without
          # the repo mount a "./relative" compose bind mount resolves to a path
          # the daemon lacks and Docker silently creates an empty dir there
          # (localstack init hooks, DB seed SQL, service configs all vanish).
          volumeMounts:
            - name: erun-home
              mountPath: /home/erun
            {{- if ne $worktreeStorage "none" }}
            - name: repo-worktree
              mountPath: {{ $worktreePath | quote }}
            {{- end }}
            - name: docker-socket
              mountPath: /var/run
            - name: docker-state
              mountPath: /var/lib/docker
        {{- end }}
        {{- with .Values.extraContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      volumes:
        - name: erun-home
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-home
        {{- if eq $worktreeStorage "host" }}
        - name: repo-worktree
          hostPath:
            path: {{ required "worktreeHostPath is required when worktreeStorage is host" .Values.worktreeHostPath | quote }}
            type: DirectoryOrCreate
        {{- else if eq $worktreeStorage "pvc" }}
        - name: repo-worktree
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-worktree
        {{- end }}
        {{- if $dindEnabled }}
        - name: docker-socket
          emptyDir: {}
        {{- end }}
        {{- if $mcpAuthSecretName }}
        - name: mcp-auth
          secret:
            secretName: {{ $mcpAuthSecretName | quote }}
            items:
              - key: {{ $mcpAuthKeyFile | quote }}
                path: {{ $mcpAuthKeyFile | quote }}
        {{- end }}
        {{- if $registryCredentialSecretName }}
        - name: registry-credential
          secret:
            secretName: {{ $registryCredentialSecretName | quote }}
            optional: true
            items:
              - key: {{ $registryCredentialKeyFile | quote }}
                path: {{ $registryCredentialKeyFile | quote }}
        {{- end }}
        {{- if $dindEnabled }}
        - name: docker-state
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-docker
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      restartPolicy: Always
{{- if eq $mcpEnabled "true" }}
---
# Fronts the runtime container's MCP port so `erun expose <tenant> <env> mcp`
# has a real Service to route to (TenantResourcePrefix(tenant)+"-mcp", the
# BackendService name the expose primitive derives from tenant + service name
# alone, independent of this chart's own release naming). Port 80 keeps the
# public hostname's default port (no --port needed) mapped onto the named
# "mcp" containerPort declared above.
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-mcp" (required "tenant is required" .Values.tenant) }}
  labels:
    app: {{ .Release.Name }}
spec:
  selector:
    app: {{ .Release.Name }}
  ports:
    - name: mcp
      port: 80
      targetPort: mcp
{{- end }}
