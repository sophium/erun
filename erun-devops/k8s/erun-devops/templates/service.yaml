{{- $mcpPort := default 17000 .Values.mcpPort -}}
{{- $sshPort := default 17022 .Values.sshPort -}}
{{- /*
worktreeStorage selects how the runtime pod sources its worktree.
  - "host":  hostPath mount of .Values.worktreeHostPath (default for local-agent envs).
  - "pvc":   PVC-backed checkout cloned at first boot (remote-agent envs).
  - "none":  no worktree mount (runtime envs that only receive deploys).
For backward compatibility: when unset and worktreeHostPath is provided,
behave as "host" so older deploys keep working. See
docs/concepts/environment-types for the type→storage mapping.
*/ -}}
{{- $worktreeStorage := default "" .Values.worktreeStorage -}}
{{- if eq $worktreeStorage "" -}}
  {{- if .Values.worktreeHostPath -}}
    {{- $worktreeStorage = "host" -}}
  {{- else -}}
    {{- $worktreeStorage = "none" -}}
  {{- end -}}
{{- end -}}
{{- $worktreeRepoName := default "" .Values.worktreeRepoName -}}
{{- if and (eq $worktreeStorage "host") (eq $worktreeRepoName "") -}}
  {{- $worktreeRepoName = base (required "worktreeHostPath is required when worktreeStorage is host" .Values.worktreeHostPath) -}}
{{- end -}}
{{- $worktreePath := "" -}}
{{- if ne $worktreeStorage "none" -}}
  {{- $worktreePath = printf "/home/erun/git/%s" (required "worktreeRepoName is required when worktreeStorage is set" $worktreeRepoName) -}}
{{- end -}}
{{- /*
envType is the canonical environment type written into the in-pod erun config
(EnvConfig.Type). It is the inverse of the worktreeStorage→type mapping that
erun-common/deploy.go:resolveWorktreeStorage applies, so the pod records the
same type the laptop resolved. The retired remote/snapshot pair is no longer
emitted; type is the single source of truth.
*/ -}}
{{- $envType := "runtime" -}}
{{- if eq $worktreeStorage "host" -}}
  {{- $envType = "local-agent" -}}
{{- else if eq $worktreeStorage "pvc" -}}
  {{- $envType = "remote-agent" -}}
{{- end -}}
{{- $idle := default dict .Values.idle -}}
{{- $idleTimeout := default "5m0s" $idle.timeout -}}
{{- $idleWorkingHours := default "08:00-20:00" $idle.workingHours -}}
{{- $idleTimezone := default "" $idle.timezone -}}
{{- $idleTrafficBytes := default 0 $idle.trafficBytes -}}
{{- $runtime := default dict .Values.runtime -}}
{{- $runtimeResources := default dict $runtime.resources -}}
{{- $runtimeLimits := default dict $runtimeResources.limits -}}
{{- $runtimeRequests := default dict $runtimeResources.requests -}}
{{- $runtimeCPU := default "4" $runtimeLimits.cpu -}}
{{- $runtimeMemory := default "8916Mi" $runtimeLimits.memory -}}
{{- $runtimeRequestCPU := default "0.25" $runtimeRequests.cpu -}}
{{- $runtimeRequestMemory := default "1024Mi" $runtimeRequests.memory -}}
{{- $managedCloud := default false .Values.managedCloud -}}
{{- $imageOverrides := default dict .Values.imageOverrides -}}
{{- $containerRegistry := default "ghcr.io/sophium" .Values.containerRegistry -}}
{{- $devopsImage := default (printf "%s/erun-devops:%s" $containerRegistry .Chart.AppVersion) (index $imageOverrides "erun-devops") -}}
{{- $mcpImage := default (printf "%s/erun-mcp:%s" $containerRegistry .Chart.AppVersion) (index $imageOverrides "erun-mcp") -}}
{{- $dindImage := default "ghcr.io/sophium/erun-dind:28.1.1-1" (index $imageOverrides "erun-dind") -}}
{{- $cloudContext := default dict .Values.cloudContext -}}
{{- $cloudContextName := default "" $cloudContext.name -}}
{{- $cloudProvider := default "" $cloudContext.provider -}}
{{- $cloudProviderAlias := default "" $cloudContext.providerAlias -}}
{{- $cloudRegion := default "" $cloudContext.region -}}
{{- $cloudInstanceID := default "" $cloudContext.instanceId -}}
{{- $useHostCredentials := default false $cloudContext.useHostCredentials -}}
{{- $claude := default dict .Values.claude -}}
{{- $claudeUseBedrock := default "0" $claude.useBedrock -}}
{{- $claudeUseMantle := default "0" $claude.useMantle -}}
{{- $claudeSmallFastRegion := default $cloudRegion $claude.smallFastModelAWSRegion -}}
{{- $claudeAvailableModels := default "opus,sonnet,haiku" $claude.availableModels -}}
{{- $claudeModel := default "" $claude.model -}}
{{- $claudeDefaultOpusModel := default "" $claude.defaultOpusModel -}}
{{- $claudeDefaultSonnetModel := default "" $claude.defaultSonnetModel -}}
{{- $claudeDefaultHaikuModel := default "" $claude.defaultHaikuModel -}}
{{- $claudeBedrockBaseURL := default "" $claude.bedrockBaseURL -}}
{{- $claudeMantleBaseURL := default "" $claude.mantleBaseURL -}}
{{- $claudeBedrockServiceTier := default "" $claude.bedrockServiceTier -}}
{{- $claudeSkipMantleAuth := default "" $claude.skipMantleAuth -}}
{{- $claudeDisablePromptCaching := default "" $claude.disablePromptCaching -}}
{{- $claudeEnablePromptCaching1H := default "" $claude.enablePromptCaching1H -}}
{{- $claudeMaxOutputTokens := default "4096" $claude.maxOutputTokens -}}
{{- $claudeMaxThinkingTokens := default "1024" $claude.maxThinkingTokens -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-home
  labels:
    app: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-docker
  labels:
    app: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
{{- if eq $worktreeStorage "pvc" }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-worktree
  labels:
    app: {{ .Release.Name }}
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
---
{{- if eq (required "environment is required" .Values.environment) "local" }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-namespace-manager
  labels:
    app: {{ .Release.Name }}
rules:
  - apiGroups:
      - ""
    resources:
      - namespaces
    verbs:
      - get
      - list
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: admin
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-namespace-manager
  labels:
    app: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-namespace-manager
---
# local-only: in contribute mode an operator runs `erun deploy` from inside the
# runtime pod, where helm authenticates as this release's ServiceAccount. That
# SA is bound to the built-in admin ClusterRole, which covers namespaced
# resources but deliberately withholds cluster-scoped RBAC — so an in-pod
# self-deploy could not even helm-diff the namespace-manager ClusterRole/
# bindings above (helm fails with "cannot get clusterroles at the cluster
# scope"). Grant the SA management of exactly this release's own cluster-scoped
# RBAC, by name, so an in-pod redeploy works without granting broad clusterrole
# escalation. The first install still comes from an admin context (which can
# create these); the SA only upgrades them in place, and it already holds every
# permission it re-applies, so the apiserver's escalation check passes.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Name }}-self-deploy
  labels:
    app: {{ .Release.Name }}
rules:
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterroles
    resourceNames:
      - {{ .Release.Name }}-namespace-manager
      - {{ .Release.Name }}-self-deploy
    verbs:
      - get
      - update
      - patch
      - delete
  - apiGroups:
      - rbac.authorization.k8s.io
    resources:
      - clusterrolebindings
    resourceNames:
      - {{ .Release.Name }}
      - {{ .Release.Name }}-namespace-manager
      - {{ .Release.Name }}-self-deploy
    verbs:
      - get
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Name }}-self-deploy
  labels:
    app: {{ .Release.Name }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Name }}-self-deploy
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app: {{ .Release.Name }}
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  replicas: 1
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: true
      serviceAccountName: {{ .Release.Name }}
      securityContext:
        fsGroup: 1000
      initContainers:
        - image: tonistiigi/binfmt:qemu-v10.0.4-56
          name: install-binfmt
          imagePullPolicy: IfNotPresent
          args:
            - --install
            - amd64,arm64
          securityContext:
            privileged: true
      containers:
        - image: {{ $devopsImage }}
          name: erun-devops
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /home/erun
            - name: KUBECONFIG
              value: /home/erun/.kube/config
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: DOCKER_BUILDKIT
              value: "1"
            - name: ERUN_REPO_PATH
              value: {{ $worktreePath | quote }}
            - name: ERUN_OUTPUTS_DIR
              value: /home/erun/.erun/outputs
            - name: ERUN_REPO_REMOTE
              value: {{ if eq $worktreeStorage "pvc" }}"true"{{ else }}"false"{{ end }}
            - name: ERUN_ENV_TYPE
              value: {{ $envType | quote }}
            - name: ERUN_CLOUD_ENVIRONMENT
              value: {{ if $managedCloud }}"true"{{ else }}"false"{{ end }}
            - name: ERUN_CLOUD_CONTEXT_NAME
              value: {{ $cloudContextName | quote }}
            - name: ERUN_CLOUD_PROVIDER
              value: {{ $cloudProvider | quote }}
            - name: ERUN_CLOUD_PROVIDER_ALIAS
              value: {{ $cloudProviderAlias | quote }}
            - name: ERUN_CLOUD_REGION
              value: {{ $cloudRegion | quote }}
            - name: ERUN_CLOUD_INSTANCE_ID
              value: {{ $cloudInstanceID | quote }}
            {{- if .Values.runtimeRegistry }}
            - name: ERUN_RUNTIME_REGISTRY
              value: {{ .Values.runtimeRegistry | quote }}
            {{- end }}
            {{- if .Values.containerRegistries }}
            - name: ERUN_CONTAINER_REGISTRIES
              value: {{ .Values.containerRegistries | toJson | quote }}
            {{- end }}
            - name: ERUN_DISABLE_BUILD_SCRIPT
              value: {{ default false .Values.disableBuildScript | quote }}
            {{ if eq $cloudProvider "aws" }}
            {{ if $useHostCredentials }}
            - name: AWS_PROFILE
              value: "erun-host"
            {{ end }}
            {{- if eq $claudeUseBedrock "1" }}
            - name: CLAUDE_CODE_USE_BEDROCK
              value: "1"
            {{- end }}
            {{- if eq $claudeUseMantle "1" }}
            - name: CLAUDE_CODE_USE_MANTLE
              value: "1"
            {{- end }}
            - name: AWS_REGION
              value: {{ $cloudRegion | quote }}
            - name: ANTHROPIC_SMALL_FAST_MODEL_AWS_REGION
              value: {{ $claudeSmallFastRegion | quote }}
            - name: ERUN_CLAUDE_AVAILABLE_MODELS
              value: {{ $claudeAvailableModels | quote }}
            - name: CLAUDE_CODE_MAX_OUTPUT_TOKENS
              value: {{ $claudeMaxOutputTokens | quote }}
            - name: MAX_THINKING_TOKENS
              value: {{ $claudeMaxThinkingTokens | quote }}
            {{ if $claudeModel }}
            - name: ANTHROPIC_MODEL
              value: {{ $claudeModel | quote }}
            {{ end }}
            {{ if $claudeDefaultOpusModel }}
            - name: ANTHROPIC_DEFAULT_OPUS_MODEL
              value: {{ $claudeDefaultOpusModel | quote }}
            {{ end }}
            {{ if $claudeDefaultSonnetModel }}
            - name: ANTHROPIC_DEFAULT_SONNET_MODEL
              value: {{ $claudeDefaultSonnetModel | quote }}
            {{ end }}
            {{ if $claudeDefaultHaikuModel }}
            - name: ANTHROPIC_DEFAULT_HAIKU_MODEL
              value: {{ $claudeDefaultHaikuModel | quote }}
            {{ end }}
            {{ if $claudeBedrockBaseURL }}
            - name: ANTHROPIC_BEDROCK_BASE_URL
              value: {{ $claudeBedrockBaseURL | quote }}
            {{ end }}
            {{ if $claudeMantleBaseURL }}
            - name: ANTHROPIC_BEDROCK_MANTLE_BASE_URL
              value: {{ $claudeMantleBaseURL | quote }}
            {{ end }}
            {{ if $claudeBedrockServiceTier }}
            - name: ANTHROPIC_BEDROCK_SERVICE_TIER
              value: {{ $claudeBedrockServiceTier | quote }}
            {{ end }}
            {{ if $claudeSkipMantleAuth }}
            - name: CLAUDE_CODE_SKIP_MANTLE_AUTH
              value: {{ $claudeSkipMantleAuth | quote }}
            {{ end }}
            {{ if $claudeDisablePromptCaching }}
            - name: DISABLE_PROMPT_CACHING
              value: {{ $claudeDisablePromptCaching | quote }}
            {{ end }}
            {{ if $claudeEnablePromptCaching1H }}
            - name: ENABLE_PROMPT_CACHING_1H
              value: {{ $claudeEnablePromptCaching1H | quote }}
            {{ end }}
            {{ end }}
            - name: ERUN_KUBERNETES_CONTEXT
              value: in-cluster
            - name: ERUN_TENANT
              value: {{ required "tenant is required" .Values.tenant | quote }}
            - name: ERUN_ENVIRONMENT
              value: {{ required "environment is required" .Values.environment | quote }}
            - name: ERUN_SSHD_ENABLED
              value: {{ if .Values.sshdEnabled }}"true"{{ else }}"false"{{ end }}
            - name: ERUN_MCP_PORT
              value: {{ $mcpPort | quote }}
            - name: ERUN_SSHD_PORT
              value: {{ $sshPort | quote }}
            - name: ERUN_IDLE_TIMEOUT
              value: {{ $idleTimeout | quote }}
            - name: ERUN_IDLE_WORKING_HOURS
              value: {{ $idleWorkingHours | quote }}
            - name: ERUN_IDLE_TIMEZONE
              value: {{ $idleTimezone | quote }}
            - name: ERUN_IDLE_TRAFFIC_BYTES
              value: {{ $idleTrafficBytes | quote }}
            - name: ERUN_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          ports:
            - containerPort: {{ $sshPort }}
              name: ssh
          resources:
            limits:
              cpu: {{ $runtimeCPU | quote }}
              memory: {{ $runtimeMemory | quote }}
            requests:
              cpu: {{ $runtimeRequestCPU | quote }}
              memory: {{ $runtimeRequestMemory | quote }}
          volumeMounts:
            - name: erun-home
              mountPath: /home/erun
            {{- if ne $worktreeStorage "none" }}
            - name: repo-worktree
              mountPath: {{ $worktreePath | quote }}
            {{- end }}
            - name: docker-socket
              mountPath: /var/run
        - image: {{ $mcpImage }}
          name: erun-mcp
          imagePullPolicy: IfNotPresent
          env:
            - name: HOME
              value: /home/erun
            - name: KUBECONFIG
              value: /home/erun/.kube/config
            - name: DOCKER_HOST
              value: unix:///var/run/docker.sock
            - name: DOCKER_BUILDKIT
              value: "1"
            - name: ERUN_REPO_PATH
              value: {{ $worktreePath | quote }}
            - name: ERUN_OUTPUTS_DIR
              value: /home/erun/.erun/outputs
            - name: ERUN_REPO_REMOTE
              value: {{ if eq $worktreeStorage "pvc" }}"true"{{ else }}"false"{{ end }}
            - name: ERUN_ENV_TYPE
              value: {{ $envType | quote }}
            - name: ERUN_KUBERNETES_CONTEXT
              value: in-cluster
            - name: ERUN_CLOUD_CONTEXT_NAME
              value: {{ $cloudContextName | quote }}
            - name: ERUN_TENANT
              value: {{ required "tenant is required" .Values.tenant | quote }}
            - name: ERUN_ENVIRONMENT
              value: {{ required "environment is required" .Values.environment | quote }}
            - name: ERUN_MCP_PORT
              value: {{ $mcpPort | quote }}
            - name: ERUN_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - containerPort: {{ $mcpPort }}
              name: mcp
          volumeMounts:
            - name: erun-home
              mountPath: /home/erun
            {{- if ne $worktreeStorage "none" }}
            - name: repo-worktree
              mountPath: {{ $worktreePath | quote }}
            {{- end }}
            - name: docker-socket
              mountPath: /var/run
        - image: {{ $dindImage }}
          name: erun-dind
          imagePullPolicy: IfNotPresent
          env:
            - name: DOCKER_TLS_CERTDIR
              value: ""
          securityContext:
            privileged: true
          readinessProbe:
            exec:
              command:
                - sh
                - -lc
                - docker info >/dev/null 2>&1
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          lifecycle:
            postStart:
              exec:
                command:
                  - sh
                  - -lc
                  - while [ ! -S /var/run/docker.sock ]; do sleep 1; done; chmod 0666 /var/run/docker.sock
          volumeMounts:
            - name: docker-socket
              mountPath: /var/run
            - name: docker-state
              mountPath: /var/lib/docker
      volumes:
        - name: erun-home
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-home
        {{- if eq $worktreeStorage "host" }}
        - name: repo-worktree
          hostPath:
            path: {{ required "worktreeHostPath is required when worktreeStorage is host" .Values.worktreeHostPath | quote }}
            type: DirectoryOrCreate
        {{- else if eq $worktreeStorage "pvc" }}
        - name: repo-worktree
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-worktree
        {{- end }}
        - name: docker-socket
          emptyDir: {}
        - name: docker-state
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-docker
      restartPolicy: Always
