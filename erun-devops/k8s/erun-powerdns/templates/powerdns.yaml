{{/*
  PowerDNS authoritative nameserver — the per-deployment global singleton that
  is authoritative for the platform's delegated services zone
  (services.<base-domain>). It runs the gpgsql backend against the SHARED
  erun-backend-postgres instance (the same Service + password Secret the API
  uses) in its own `powerdns` database, so it must be sequenced AFTER
  erun-backend-postgres in the deploy plan.

  - :53 is bound on the node via hostNetwork so the public glue record
    (ns1.<base-domain> -> <authoritativeIP>) resolves to this pod. dnsPolicy
    ClusterFirstWithHostNet keeps cluster DNS so the postgres Service still resolves.
    The container runs as the image's non-root `pdns` user, so it carries
    NET_BIND_SERVICE to bind the privileged :53 portably (k8s does not relax
    ip_unprivileged_port_start the way the local Docker default does).
  - The HTTP API/webserver is bound to loopback only (127.0.0.1) and is NOT
    exposed cluster-wide: record writes happen via `pdnsutil` against the gpgsql
    backend (see `erun-common/expose_exec.go`), not the HTTP API. The api-key
    Secret and the local webserver remain so a future in-pod DNS-01 broker has a
    foundation; reaching the API from another pod is a deliberate Phase B change.
  - The gpgsql backend config (including the postgres password and api-key) is
    written once to a generated pdns.conf on a per-pod volume and consumed via
    --config-dir, so secrets never appear in process argv. pdnsutil in this
    PowerDNS line does not accept --launch/--gpgsql-* on the command line, so a
    config file is the only way to point it at the backend; pdns_server uses the
    same file. The image ships a default sqlite pdns.conf that is fatal under
    --launch=gpgsql, which --config-dir to the generated file also avoids.
  - The gpgsql schema is lifted out of the pinned PowerDNS image itself, so it
    always matches the server version, then loaded once into the powerdns DB.

  Wrap-and-pin (erun-devops/AGENTS.md): the image rides
  imageOverrides.erun-powerdns (default <registry>/erun-powerdns:<VERSION>); the
  schema-load step reuses the erun-backend-postgres image for psql/createdb.
*/}}
{{- $tenant := default "erun" .Values.tenant -}}
{{- $postgres := default dict (default dict .Values.api).postgres -}}
{{- $postgresUser := default "erun" $postgres.user -}}
{{- $postgresPort := default 5432 $postgres.port -}}
{{- $postgresHost := default (printf "%s-postgres" $tenant) $postgres.host -}}
{{- $postgresPasswordSecretName := default (printf "%s-backend-postgres" $tenant) $postgres.passwordSecretName -}}
{{- $postgresPasswordSecretKey := default "password" $postgres.passwordSecretKey -}}
{{- $powerdns := default dict .Values.powerdns -}}
{{- $powerdnsDatabase := default "powerdns" $powerdns.database -}}
{{- $apiPort := default 8081 $powerdns.apiPort -}}
{{- $apiKeySecretName := default (printf "%s-powerdns-api" $tenant) $powerdns.apiKeySecretName -}}
{{- $apiKeySecretKey := default "api-key" $powerdns.apiKeySecretKey -}}
{{- $apiKey := default "" $powerdns.apiKey -}}
{{- $existingAPISecret := lookup "v1" "Secret" .Release.Namespace $apiKeySecretName -}}
{{- if and (eq $apiKey "") $existingAPISecret (hasKey $existingAPISecret.data $apiKeySecretKey) -}}
{{- $apiKey = (index $existingAPISecret.data $apiKeySecretKey | b64dec) -}}
{{- end -}}
{{- if eq $apiKey "" -}}
{{- $apiKey = randAlphaNum 40 -}}
{{- end -}}
{{- /* RFC2136 dynamic-update (DNS UPDATE + TSIG) so cert-manager's rfc2136 DNS-01
       solver can write _acme-challenge TXT records into the services zone. On by
       default for the platform singleton; the TSIG key is auto-generated and
       lookup-persisted like the api-key. Algorithm string is PowerDNS's form
       (hmac-sha256); cert-manager uses its own uppercase form (HMACSHA256), wired
       separately in terraform-erun-cluster-edge. */ -}}
{{- $dnsUpdateEnabled := default true $powerdns.dnsUpdateEnabled -}}
{{- $tsigSecretName := default (printf "%s-powerdns-tsig" $tenant) $powerdns.tsigSecretName -}}
{{- $tsigSecretKey := default "tsig-secret" $powerdns.tsigSecretKey -}}
{{- $tsigKeyName := default (printf "%s-dnsupdate" $tenant) $powerdns.tsigKeyName -}}
{{- $tsigAlgorithm := default "hmac-sha256" $powerdns.tsigAlgorithm -}}
{{- $tsigSecret := default "" $powerdns.tsigSecret -}}
{{- $existingTSIGSecret := lookup "v1" "Secret" .Release.Namespace $tsigSecretName -}}
{{- if and (eq $tsigSecret "") $existingTSIGSecret (hasKey $existingTSIGSecret.data $tsigSecretKey) -}}
{{- $tsigSecret = (index $existingTSIGSecret.data $tsigSecretKey | b64dec) -}}
{{- end -}}
{{- if eq $tsigSecret "" -}}
{{- $tsigSecret = (randAlphaNum 32 | b64enc) -}}
{{- end -}}
{{- $imageOverrides := default dict .Values.imageOverrides -}}
{{- $containerRegistry := default "ghcr.io/sophium" .Values.containerRegistry -}}
{{- $powerdnsImage := default (printf "%s/erun-powerdns:4.9.3" $containerRegistry) (index $imageOverrides "erun-powerdns") -}}
{{- $postgresImage := default (printf "%s/erun-backend-postgres:18.3" $containerRegistry) (index $imageOverrides "erun-backend-postgres") -}}
{{- $platform := default dict .Values.platform -}}
{{- $servicesZone := default "" $platform.servicesZone -}}
{{- $nameservers := default (list) $platform.nameservers -}}
{{- /* pdns listen address. Under hostNetwork a 0.0.0.0:53 bind collides with
       systemd-resolved's 127.0.0.53:53 stub on nodes that run it, and the public
       authoritative IP is typically a NAT'd address that is not a local
       interface (so it can't be bound directly). So bind the node's own
       interface IP: it coexists with the node resolver's loopback stub and still
       receives traffic DNAT'd from the public authoritative IP. Default to the
       node's hostIP (injected into config-gen via the downward API as HOST_IP),
       which is the interface the public IP NATs to; an explicit
       powerdns.localAddress overrides it — e.g. 0.0.0.0 on a node where :53 is
       free, or a specific address on a multi-homed node. */ -}}
{{- $localAddress := default "" $powerdns.localAddress -}}
{{- $configDir := "/etc/pdns-shared" -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $apiKeySecretName }}
  labels:
    app: {{ $tenant }}-powerdns
type: Opaque
stringData:
  {{ $apiKeySecretKey }}: {{ $apiKey | quote }}
{{- if $dnsUpdateEnabled }}
---
# TSIG key for RFC2136 dynamic updates. Auto-generated + lookup-persisted like
# the api-key. Consumed two ways on this cluster: imported into PowerDNS by the
# zone-bootstrap init, and read back by the hosting-edge apply to wire
# cert-manager's rfc2136 tsigSecretSecretRef. `algorithm`/`key-name` ride along
# so the edge doesn't have to re-derive them.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $tsigSecretName }}
  labels:
    app: {{ $tenant }}-powerdns
type: Opaque
stringData:
  {{ $tsigSecretKey }}: {{ $tsigSecret | quote }}
  algorithm: {{ $tsigAlgorithm | quote }}
  key-name: {{ $tsigKeyName | quote }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $tenant }}-powerdns
  labels:
    app: {{ $tenant }}-powerdns
spec:
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ $tenant }}-powerdns
  replicas: 1
  template:
    metadata:
      labels:
        app: {{ $tenant }}-powerdns
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      initContainers:
        # Generate the gpgsql backend config (with the postgres password and
        # api-key from their Secrets) onto a per-pod volume, consumed by both
        # pdns_server and pdnsutil via --config-dir. Keeps secrets out of argv,
        # and avoids the image's default sqlite pdns.conf that is fatal under
        # --launch=gpgsql.
        - name: config-gen
          image: {{ $powerdnsImage }}
          env:
            - name: PDNS_GPGSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $postgresPasswordSecretName }}
                  key: {{ $postgresPasswordSecretKey }}
            - name: PDNS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $apiKeySecretName }}
                  key: {{ $apiKeySecretKey }}
            # The node's own interface IP, so local-address can bind it instead
            # of 0.0.0.0 and coexist with a systemd-resolved loopback stub.
            - name: HOST_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
          command:
            - sh
            - -c
            - |
              set -eu
              umask 077
              cat > {{ $configDir }}/pdns.conf <<EOF
              launch=gpgsql
              gpgsql-host={{ $postgresHost }}
              gpgsql-port={{ $postgresPort }}
              gpgsql-dbname={{ $powerdnsDatabase }}
              gpgsql-user={{ $postgresUser }}
              gpgsql-password=$PDNS_GPGSQL_PASSWORD
              local-address={{ $localAddress | default "$HOST_IP" }}
              local-port=53
              api=yes
              api-key=$PDNS_API_KEY
              webserver=yes
              webserver-address=127.0.0.1
              webserver-port={{ $apiPort }}
              webserver-allow-from=127.0.0.1
              {{- if $dnsUpdateEnabled }}
              dnsupdate=yes
              gpgsql-dnssec=yes
              allow-dnsupdate-from=
              {{- end }}
              EOF
          volumeMounts:
            - name: config
              mountPath: {{ $configDir }}
        # Lift the gpgsql schema out of the pinned PowerDNS image so it always
        # matches the server version, onto a shared volume the loader can read.
        - name: schema-source
          image: {{ $powerdnsImage }}
          command:
            - sh
            - -c
            - cp /usr/local/share/doc/pdns/schema.pgsql.sql /schema/schema.sql
          volumeMounts:
            - name: schema
              mountPath: /schema
        # Create the powerdns database on the shared postgres and load the
        # schema once. Both steps are guarded so re-deploys are idempotent.
        # Reuses the postgres image for psql/createdb/pg_isready.
        - name: schema-load
          image: {{ $postgresImage }}
          env:
            - name: PGHOST
              value: {{ $postgresHost | quote }}
            - name: PGPORT
              value: {{ $postgresPort | quote }}
            - name: PGUSER
              value: {{ $postgresUser | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $postgresPasswordSecretName }}
                  key: {{ $postgresPasswordSecretKey }}
            - name: PDNS_DB
              value: {{ $powerdnsDatabase | quote }}
          command:
            - sh
            - -c
            - |
              set -e
              until pg_isready -q; do echo "waiting for postgres"; sleep 2; done
              if ! psql -tAc "SELECT 1 FROM pg_database WHERE datname = '$PDNS_DB'" | grep -q 1; then
                createdb "$PDNS_DB"
              fi
              if ! psql -d "$PDNS_DB" -tAc "SELECT to_regclass('public.domains')" | grep -q domains; then
                psql -d "$PDNS_DB" -v ON_ERROR_STOP=1 -f /schema/schema.sql
              fi
          volumeMounts:
            - name: schema
              mountPath: /schema
        {{- if $servicesZone }}
        # Bootstrap the authoritative services zone once, with its nameservers,
        # from the per-instance platform config that deploy threads in as
        # platform.* values. Idempotent (skips when the zone already exists).
        # Per-env wildcard/_acme-challenge records are added later via pdnsutil.
        - name: zone-bootstrap
          image: {{ $powerdnsImage }}
          command:
            - sh
            - -c
            - |
              set -e
              if ! pdnsutil --config-dir={{ $configDir }} list-zone {{ $servicesZone | quote }} >/dev/null 2>&1; then
                # `pdnsutil create-zone ZONE [nsname]` takes at most ONE
                # nameserver; passing more prints a usage error, exits 0, and
                # creates nothing — silently leaving the zone unbootstrapped. So
                # create with the first NS (if any) and add the rest as NS records.
                pdnsutil --config-dir={{ $configDir }} create-zone {{ $servicesZone | quote }}{{ with (first $nameservers) }} {{ . | quote }}{{ end }}
                {{- range $ns := (rest $nameservers) }}
                pdnsutil --config-dir={{ $configDir }} add-record {{ $servicesZone | quote }} @ NS {{ $ns | quote }}
                {{- end }}
              fi
              {{- if $dnsUpdateEnabled }}
              # Import the TSIG key and authorize it for dynamic updates on the
              # services zone (idempotent) so cert-manager's rfc2136 DNS-01 solver
              # can write _acme-challenge TXT records.
              pdnsutil --config-dir={{ $configDir }} import-tsig-key {{ $tsigKeyName | quote }} {{ $tsigAlgorithm | quote }} {{ $tsigSecret | quote }} 2>/dev/null || true
              pdnsutil --config-dir={{ $configDir }} set-meta {{ $servicesZone | quote }} TSIG-ALLOW-DNSUPDATE {{ $tsigKeyName | quote }}
              {{- end }}
          volumeMounts:
            - name: config
              mountPath: {{ $configDir }}
        {{- end }}
      containers:
        - name: erun-powerdns
          image: {{ $powerdnsImage }}
          imagePullPolicy: IfNotPresent
          securityContext:
            # Bind privileged :53 under hostNetwork. k8s adds capabilities to the
            # bounding set, not the ambient set, so a non-root process cannot use
            # NET_BIND_SERVICE on k3s/containerd — run as root to bind :53. (A
            # cleaner alternative is to setcap cap_net_bind_service on the wrapper
            # image's pdns_server and keep non-root; that needs an image rebuild.)
            runAsUser: 0
            capabilities:
              add: ["NET_BIND_SERVICE"]
          command:
            - pdns_server
            - --config-dir={{ $configDir }}
          ports:
            - name: dns-udp
              containerPort: 53
              hostPort: 53
              protocol: UDP
            - name: dns-tcp
              containerPort: 53
              hostPort: 53
              protocol: TCP
          # Probe the authoritative DNS port (the served surface). The HTTP API
          # is loopback-only, so kubelet (which probes the pod/node IP under
          # hostNetwork) cannot reach it.
          readinessProbe:
            tcpSocket:
              port: dns-tcp
            periodSeconds: 5
            timeoutSeconds: 2
          startupProbe:
            tcpSocket:
              port: dns-tcp
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 60
          volumeMounts:
            - name: config
              mountPath: {{ $configDir }}
      volumes:
        - name: schema
          emptyDir: {}
        - name: config
          emptyDir: {}
      restartPolicy: Always
{{- if $dnsUpdateEnabled }}
---
# In-cluster nameserver Service, so cert-manager's rfc2136 solver has a stable
# endpoint to send DNS UPDATE to. The pod is hostNetwork, so the Service's
# endpoint resolves to the node IP where PowerDNS binds :53; both protocols are
# required. Not the public NAT'd authoritative IP (which may not accept inbound
# in-cluster UPDATE) — this Service targets the pod/node directly.
apiVersion: v1
kind: Service
metadata:
  name: {{ $tenant }}-powerdns
  labels:
    app: {{ $tenant }}-powerdns
spec:
  selector:
    app: {{ $tenant }}-powerdns
  ports:
    - name: dns-udp
      port: 53
      targetPort: 53
      protocol: UDP
    - name: dns-tcp
      port: 53
      targetPort: 53
      protocol: TCP
{{- end }}
