{{- $tenant := default "erun" .Values.tenant -}}
{{- $postgres := default dict (default dict .Values.api).postgres -}}
{{- $postgresDatabase := default "erun" $postgres.database -}}
{{- $postgresUser := default "erun" $postgres.user -}}
{{- $postgresPort := default 5432 $postgres.port -}}
{{- $postgresPasswordSecretName := default (printf "%s-backend-postgres" $tenant) $postgres.passwordSecretName -}}
{{- $postgresPasswordSecretKey := default "password" $postgres.passwordSecretKey -}}
{{- $postgresReset := default false $postgres.reset -}}
{{- $imageOverrides := default dict .Values.imageOverrides -}}
{{- $containerRegistry := default "ghcr.io/sophium" .Values.containerRegistry -}}
{{- $postgresImage := default (printf "%s/erun-backend-postgres:18.6" $containerRegistry) (index $imageOverrides "erun-backend-postgres") -}}
{{- if $postgresReset }}
# A hook Job so the reset runs once per deploy, never on a pod restart; it
# wipes over the network so it never contends for the data PVC.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $tenant }}-postgres-reset
  labels:
    app: {{ $tenant }}-postgres-reset
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: {{ $tenant }}-postgres-reset
    spec:
      restartPolicy: Never
      containers:
        - image: {{ $postgresImage }}
          name: erun-postgres-reset
          imagePullPolicy: IfNotPresent
          env:
            - name: PGHOST
              value: {{ printf "%s-postgres" $tenant | quote }}
            - name: PGPORT
              value: {{ $postgresPort | quote }}
            - name: PGUSER
              value: {{ $postgresUser | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $postgresPasswordSecretName }}
                  key: {{ $postgresPasswordSecretKey }}
            - name: PGDATABASE
              value: {{ $postgresDatabase | quote }}
          command:
            - sh
            - -c
            - |
              set -eu
              until pg_isready -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres; do sleep 1; done
              psql -v ON_ERROR_STOP=1 -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -c "DROP DATABASE IF EXISTS \"$PGDATABASE\" WITH (FORCE);"
              psql -v ON_ERROR_STOP=1 -h "$PGHOST" -p "$PGPORT" -U "$PGUSER" -d postgres -c "CREATE DATABASE \"$PGDATABASE\" OWNER \"$PGUSER\";"
{{- end }}
