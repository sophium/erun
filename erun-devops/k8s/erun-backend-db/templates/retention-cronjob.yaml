{{- $tenant := default "erun" .Values.tenant -}}
{{- $api := default dict .Values.api -}}
{{- $postgres := default dict $api.postgres -}}
{{- $postgresDatabase := default "erun" $postgres.database -}}
{{- $postgresUser := default "erun" $postgres.user -}}
{{- $postgresPort := default 5432 $postgres.port -}}
{{- $postgresPasswordSecretName := default (printf "%s-backend-postgres" $tenant) $postgres.passwordSecretName -}}
{{- $postgresPasswordSecretKey := default "password" $postgres.passwordSecretKey -}}
{{- $databaseURL := default (printf "postgres://%s:$(ERUN_POSTGRES_PASSWORD)@%s-postgres:%v/%s?sslmode=disable" $postgresUser $tenant $postgresPort $postgresDatabase) $api.databaseURL -}}
{{- $imageOverrides := default dict .Values.imageOverrides -}}
{{- $containerRegistry := default "ghcr.io/sophium" .Values.containerRegistry -}}
{{- $backendDBImage := default (printf "%s/erun-backend-db:%s" $containerRegistry .Chart.AppVersion) (index $imageOverrides "erun-backend-db") -}}
{{- $retention := default dict .Values.retention -}}
{{- $retentionEnabled := default false $retention.enabled -}}
{{/* default/dict can't distinguish "unset" from "explicitly false" (sprig's
     default treats false as empty), so retention.dryRun=false needs the same
     hasKey-guarded resolution mcpEnabled uses in erun-devops/templates/service.yaml
     -- otherwise an operator opting into real deletion would silently stay in
     dry-run mode. */}}
{{- $retentionDryRun := true -}}
{{- if hasKey $retention "dryRun" -}}
{{- $retentionDryRun = $retention.dryRun -}}
{{- end -}}
# Off by default, and dry-run by default once enabled, so a fresh deploy never
# deletes rows until an operator sets retention.dryRun=false.
{{- if $retentionEnabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $tenant }}-backend-db-retention
  labels:
    app: {{ $tenant }}-backend-db-retention
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Three days: a daily job's failed log must outlive the next run.
      backoffLimit: 0
      ttlSecondsAfterFinished: 259200
      template:
        metadata:
          labels:
            app: {{ $tenant }}-backend-db-retention
        spec:
          restartPolicy: Never
          containers:
            - image: {{ $backendDBImage }}
              name: erun-backend-db-retention
              imagePullPolicy: IfNotPresent
              command: ["erun-backend-db-retention"]
              env:
                - name: HOME
                  value: /home/erun
                - name: ERUN_RETENTION_DRY_RUN
                  value: {{ $retentionDryRun | toString | quote }}
                - name: ERUN_POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ $postgresPasswordSecretName }}
                      key: {{ $postgresPasswordSecretKey }}
                - name: ERUN_DATABASE_URL
                  value: {{ $databaseURL | quote }}
{{- end }}
