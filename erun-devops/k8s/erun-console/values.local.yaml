# Local-environment overlay. Empty by default, like erun-zitadel's: the
# external domain, and any cert-manager issuer, come from the platform
# environment's config at deploy time, not from this overlay. A local deploy
# still needs console.externalDomain (or platform.baseDomain) set, and the
# render fails loudly without it.
console:
  ingressClass: traefik
