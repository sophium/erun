version: "2"

run:
  timeout: 3m
  tests: true
# uniq-by-line keys on file+line only, so funlen/gocyclo/cyclop on one func line
# would collapse to a single finding.
issues:
  uniq-by-line: false
  max-issues-per-linter: 0
  max-same-issues: 0
linters:
  exclusions:
    paths:
      # npm vendors Go into this module. Unanchored because a cached finding keeps
      # the path spelling of the run that cached it.
      - (^|/)node_modules/
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - funlen
    - gocyclo
    - cyclop
    - revive
    - errorlint
    - bodyclose
    - nilerr
    - nilnil
    - exhaustive
    - gocritic
    - forcetypeassert
    - errchkjson
    - predeclared
    - errname
    - unconvert
    - copyloopvar
    - usestdlibvars
    - misspell
    - wastedassign
    - mirror
    - nestif
    - makezero
    - durationcheck
    - nakedret
  settings:
    revive:
      rules:
        - name: file-length-limit
          arguments:
            - max: 500
              skipComments: true
              skipBlankLines: true
    funlen:
      lines: 100
      statements: 50
    gocyclo:
      min-complexity: 15
    cyclop:
      max-complexity: 10
formatters:
  enable:
    - gofumpt
  settings:
    gofumpt:
      module-path: github.com/sophium/erun/erun-ui
