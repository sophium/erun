version: 3
workdir: .
allow:
  depOnAnyVendor: false
  deepScan: false

vendors:
  cgo:
    in: ["C"]
  github-com-ActiveState-termtest-conpty:
    in: ["github.com/ActiveState/termtest/conpty", "github.com/ActiveState/termtest/conpty/**"]
  github-com-adrg-xdg:
    in: ["github.com/adrg/xdg", "github.com/adrg/xdg/**"]
  github-com-creack-pty:
    in: ["github.com/creack/pty", "github.com/creack/pty/**"]
  github-com-fsnotify-fsnotify:
    in: ["github.com/fsnotify/fsnotify", "github.com/fsnotify/fsnotify/**"]
  github-com-google-uuid:
    in: ["github.com/google/uuid", "github.com/google/uuid/**"]
  github-com-modelcontextprotocol-go-sdk:
    in: ["github.com/modelcontextprotocol/go-sdk", "github.com/modelcontextprotocol/go-sdk/**"]
  github-com-sophium-erun-erun-common:
    in: ["github.com/sophium/erun/erun-common", "github.com/sophium/erun/erun-common/**"]
  github-com-wailsapp-wails-v2:
    in: ["github.com/wailsapp/wails/v2", "github.com/wailsapp/wails/v2/**"]

excludeFiles:
  - "^.*/node_modules/.*$"

exclude:
  - playwright/fixtures/winstub

components:
  headlessserver:
    in: "headlessserver"
  internal-cloudctx:
    in: "internal/cloudctx"
  internal-runtimeview:
    in: "internal/runtimeview"
  internal-settings:
    in: "internal/settings"
  internal-tenant:
    in: "internal/tenant"
  internal-uimodel:
    in: "internal/uimodel"
  root:
    in: "."

deps:
  internal-cloudctx:
    mayDependOn:
      - internal-uimodel
    canUse:
      - github-com-modelcontextprotocol-go-sdk
      - github-com-sophium-erun-erun-common
  internal-runtimeview:
    mayDependOn:
      - internal-uimodel
    canUse:
      - github-com-adrg-xdg
      - github-com-sophium-erun-erun-common
  internal-settings:
    mayDependOn:
      - internal-uimodel
    canUse:
      - github-com-adrg-xdg
      - github-com-fsnotify-fsnotify
      - github-com-sophium-erun-erun-common
  internal-tenant:
    mayDependOn:
      - internal-uimodel
    canUse:
      - github-com-sophium-erun-erun-common
  root:
    mayDependOn:
      - headlessserver
      - internal-cloudctx
      - internal-runtimeview
      - internal-settings
      - internal-tenant
      - internal-uimodel
    canUse:
      - cgo
      - github-com-ActiveState-termtest-conpty
      - github-com-adrg-xdg
      - github-com-creack-pty
      - github-com-google-uuid
      - github-com-modelcontextprotocol-go-sdk
      - github-com-sophium-erun-erun-common
      - github-com-wailsapp-wails-v2
