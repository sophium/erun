name: erun-console-zitadel

# A real, local Zitadel v4 — the faithful production topology, not a single
# container. v4 serves the interactive login from a SEPARATE container
# (zitadel-login, "Login V2"); core has no login UI of its own. So this brings
# up core + the login container + Postgres, with an nginx proxy unifying them
# under one origin (http://localhost:8080): /ui/v2/login -> login, everything
# else -> core. `start-from-init` writes two machine-user PATs to a shared
# volume (provision.sh reads them): an org-owner service account for headless
# provisioning, and the IAM_LOGIN_CLIENT PAT the login container needs.

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zitadel
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 10s
      retries: 20
    networks: [znet]

  zitadel-api:
    image: ghcr.io/zitadel/zitadel:v4.15.3
    user: '0'
    command: start-from-init --masterkey "MasterkeyNeedsToHave32Characters" --tlsMode disabled
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 8080
      ZITADEL_EXTERNALSECURE: false
      ZITADEL_TLS_ENABLED: false

      ZITADEL_DATABASE_POSTGRES_HOST: postgres
      ZITADEL_DATABASE_POSTGRES_PORT: 5432
      ZITADEL_DATABASE_POSTGRES_DATABASE: zitadel
      ZITADEL_DATABASE_POSTGRES_USER_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_USER_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_USER_SSL_MODE: disable
      ZITADEL_DATABASE_POSTGRES_ADMIN_USERNAME: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_PASSWORD: postgres
      ZITADEL_DATABASE_POSTGRES_ADMIN_SSL_MODE: disable

      # First-instance org + a human admin with a permanent password (no forced
      # change), so the Playwright spec drives a deterministic single login page.
      ZITADEL_FIRSTINSTANCE_ORG_NAME: erun
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: zadmin
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: 'Password1!'
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: false
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: zadmin@erun.local
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: true

      # Org-owner service account; its PAT is written to the shared volume so
      # provision.sh can create the OIDC app headlessly (no UI, no admin login).
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin-sa.pat
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: admin-sa
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: Admin Service Account
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: '2030-01-01T00:00:00Z'

      # IAM_LOGIN_CLIENT machine-user PAT the v2 login container authenticates with.
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: Login Client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: '2030-01-01T00:00:00Z'

      # Require + route Login V2 to the login container (served at /ui/v2/login).
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: true
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: http://localhost:8080/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: http://localhost:8080/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: http://localhost:8080/ui/v2/login/logout?post_logout_redirect=
    healthcheck:
      test: ['CMD', '/app/zitadel', 'ready']
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 20s
    volumes:
      - bootstrap:/zitadel/bootstrap:rw
    networks: [znet]
    depends_on:
      postgres:
        condition: service_healthy

  zitadel-login:
    image: ghcr.io/zitadel/zitadel-login:v4.15.3
    user: '0'
    environment:
      ZITADEL_API_URL: http://zitadel-api:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:localhost:8080,X-Forwarded-Proto:http
    healthcheck:
      test: ['CMD', '/bin/sh', '-c', 'node /app/healthcheck.mjs http://localhost:3000/ui/v2/login/healthy']
      interval: 5s
      timeout: 30s
      retries: 30
      start_period: 20s
    volumes:
      - bootstrap:/zitadel/bootstrap:ro
    networks: [znet]
    depends_on:
      zitadel-api:
        condition: service_healthy

  proxy:
    image: nginx:1.27-alpine
    ports:
      - '8080:8080'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks: [znet]
    depends_on:
      zitadel-api:
        condition: service_healthy

networks:
  znet:
    name: erun-console-znet

volumes:
  bootstrap:
