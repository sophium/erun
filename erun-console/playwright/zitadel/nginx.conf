events {}
http {
  # Docker's embedded DNS, so upstreams resolve at request time (no startup race
  # against the api/login containers). Upstream names are the container names
  # stack.sh creates.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto http;
    proxy_set_header Connection "";

    # The v4 Login V2 UI (a Next.js app) serves under /ui/v2/login.
    location /ui/v2/login {
      set $login_upstream erun-console-e2e-zlogin:3000;
      proxy_pass http://$login_upstream$request_uri;
    }

    # Everything else (OIDC discovery, authorize, token, jwks) -> core.
    location / {
      set $api_upstream erun-console-e2e-zitadel:8080;
      proxy_pass http://$api_upstream$request_uri;
    }
  }
}
