<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <meta
      content="Agentic coding from idea to production — at speed, without compromising compliance."
      name="description"
    />
    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <!-- The bundled product-level default: this file is one build serving any
         instance, so it names no instance. The container's entrypoint rewrites
         these brand-bearing tags from the deploy's platform.brand before nginx
         serves the page (docker-entrypoint.d/05-platform-brand.sh), and injects
         the same value as window.__ERUN_PLATFORM_BRAND__ for the bundle's own
         pre-resolution paint (src/shell/brand.ts) — so what the page shows
         before the bundle runs is what GET /v1/platform also supplies. An
         instance that configures no brand keeps this default on both sides.
         Keep this title agreeing with that script's fallback: src/shell/
         brand.test.ts asserts the two directly. -->
    <title>ERun console</title>
    <meta content="ERun console" property="og:title" />
    <meta
      content="Agentic coding from idea to production — at speed, without compromising compliance."
      property="og:description"
    />
    <meta content="website" property="og:type" />
    <meta content="summary" name="twitter:card" />
    <meta content="ERun console" name="twitter:title" />
    <meta
      content="Agentic coding from idea to production — at speed, without compromising compliance."
      name="twitter:description"
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="./src/main.tsx" type="module"></script>
  </body>
</html>
